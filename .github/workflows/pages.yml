# =====================================================================
#  Publication du site sur GitHub Pages
#  ---------------------------------------------------------------------
#  Déploiement STATIQUE : le site est du HTML, du CSS et du JavaScript
#  écrits à la main, il n'y a rien à transformer — on ne passe donc pas
#  par Jekyll.
#
#  DEUX RÉGLAGES QUI ONT COÛTÉ CHER, À NE PAS RETIRER :
#
#  1. `timeout` sur l'étape de déploiement, porté au MAXIMUM autorisé —
#     600 000 ms. Au-delà, GitHub ramène silencieusement à cette valeur :
#     inutile d'écrire davantage. Le site pèse une trentaine de mégaoctets
#     (184 narrations) et la file d'attente de Pages est parfois plus
#     lente que ce délai ; les déploiements échouent alors sur « Timeout
#     reached » sans que rien ne soit cassé dans le site.
#
#  2. Le ménage avant empaquetage. Les fichiers autonomes de relecture et
#     les tutos d'origine ne servent pas au site : ils sont dans le dépôt
#     pour être téléchargés, pas pour être servis. Les écarter allège
#     l'artefact de plusieurs mégaoctets et raccourcit d'autant l'attente.
# =====================================================================
name: Publier le site

on:
  push:
    branches: [master]
  workflow_dispatch:        # permet de relancer à la main depuis GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Écarter ce qui n'est pas servi par le site
        run: |
          # Fichiers autonomes : ils vivent dans le dépôt pour être
          # téléchargés, le site n'en a pas besoin.
          rm -f MAQUETTE-BETA.html CAPSULE-AVEC-LA-VOIX.html ECOUTER-LES-VOIX.html
          rm -f ACCUEIL.html inventaire.html
          # Le fonds d'origine : seuls les schémas et le moteur sont
          # utilisés par les capsules. Les tutos, sons d'ambiance et
          # photos restent dans le dépôt, hors du site.
          find fonds-origine/packs/fluides/res -mindepth 1 -maxdepth 1 \
               -type d ! -name svg -exec rm -rf {} +
          rm -rf refonte/voix/echantillons
          echo "Poids du site à publier :"
          du -sh . --exclude=.git

      - name: Préparer Pages
        uses: actions/configure-pages@v5

      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Déployer
        id: deploiement
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000         # 10 min : c'est le MAXIMUM accepté, au-delà
                                  # GitHub ramène silencieusement à cette valeur
          error_count: 20
