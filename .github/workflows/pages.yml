# =====================================================================
#  Publication du site sur GitHub Pages
#  ---------------------------------------------------------------------
#  Déploiement STATIQUE : le dépôt est publié tel quel, sans passer par
#  Jekyll. C'est voulu — le site est du HTML, du CSS et du JavaScript
#  écrits à la main, il n'y a rien à transformer. Le mode d'origine
#  (« legacy ») échouait sans message exploitable ; celui-ci donne un
#  journal lisible quand quelque chose casse.
# =====================================================================
name: Publier le site

on:
  push:
    branches: [master]
  workflow_dispatch:        # permet de relancer à la main depuis GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer Pages
        uses: actions/configure-pages@v5

      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Déployer
        id: deploiement
        uses: actions/deploy-pages@v4
