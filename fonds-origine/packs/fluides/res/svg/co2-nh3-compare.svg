<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" role="img"
     aria-label="Comparaison animée du CO2 et de l'ammoniac, les deux locaux côte à côte. Le CO2, R-744, est classé A1, sans odeur, plus lourd que l'air : il s'accumule en partie basse du local, et relève de la catégorie B. L'ammoniac, R-717, est classé B2L, toxique et faiblement inflammable, d'odeur piquante, plus léger que l'air : il monte vers le plafond, et relève de la catégorie C. L'animation joue les deux comportements en même temps et en boucle : à gauche la nappe de CO2 part du sol et remplit le local par le bas pendant qu'à droite la nappe d'ammoniac part du plafond et remplit le local par le haut ; les deux flèches dérivent en sens inverse. Une attestation A1 ou A2 ne donne aucun droit d'intervention sur ces deux fluides.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
    <cc:Work rdf:about="">
