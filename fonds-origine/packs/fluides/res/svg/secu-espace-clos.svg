<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img"
     aria-label="Le double accident en espace clos, en trois temps. 1 : dans un local fermé, le gaz remplit le volume par le bas, rien ne se voit ni ne se sent. 2 : le technicien descend et perd connaissance dans la nappe de gaz. 3 : un collègue descend le secourir sans protection et devient la seconde victime. La règle : ventiler, mesurer, jamais seul, et devant une personne au sol, alerter sans descendre.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
    <cc:Work rdf:about="">
      <dc:title>Le double accident en espace clos, en trois temps</dc:title>
      <dc:creator><cc:Agent><dc:title>inerWeb — F. Henninot</dc:title></cc:Agent></dc:creator>
