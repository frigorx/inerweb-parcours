<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img"
     aria-label="Introduction animée du module sécurité. Premier temps : tout le reste de la formation apprend à protéger l'installation et l'environnement. Deuxième temps : ce module-ci apprend à se protéger soi-même. Troisième temps : les cinq dangers — l'air qui manque, le froid qui brûle, la flamme interdite, ce qui éclate, le risque électrique. Conclusion : la sécurité se démontre et s'impose, elle ne se découvre jamais par l'erreur.">
  <title>Module sécurité — introduction</title>
  <style>
    .h1 { font:700 30px Calibri,Segoe UI,sans-serif; fill:#1b3a63; }
    .h2 { font:700 22px Calibri,Segoe UI,sans-serif; fill:#1b3a63; }
    .lg { font:400 17px Calibri,Segoe UI,sans-serif; fill:#4a5b6e; }
    .pt { font:700 14px Calibri,Segoe UI,sans-serif; fill:#1b3a63; }
    .p  { fill:none; stroke:#1b3a63; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
    .acc{ fill:none; stroke:#c9451a; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
    /* À L'IMPRESSION, où rien ne s'anime : les scènes intermédiaires sont
       retirées et SEULE l'image finale s'affiche — elle se suffit à elle-même.
       (Les afficher toutes les superposerait.)
       Cette règle ne dépend PLUS de `prefers-reduced-motion` : sur une machine
       aux effets d'animation Windows désactivés, elle réduisait cette
       introduction en quatre scènes à sa dernière image. L'enchaînement est le
       contenu, pas un ornement. */
    @media print {
      .scene    { display: none; }
      .scene-fin { display: block; opacity: 1 !important; }
    }
  </style>

  <rect width="900" height="440" fill="#ffffff"/>

  <!-- ================= SCÈNE A : ce que fait le reste de la formation ================= -->
  <g class="scene" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.85;1" dur="4.6s" begin="0.2s" fill="remove"/>

    <text class="h2" x="450" y="70" text-anchor="middle">Tout le reste de cette formation</text>
    <text class="h1" x="450" y="112" text-anchor="middle">protège l'installation</text>
    <text class="h1" x="450" y="150" text-anchor="middle">et l'environnement</text>

    <!-- machine -->
    <g transform="translate(300,210)">
      <rect class="p" x="0" y="0" width="120" height="86" rx="6"/>
      <line class="p" x1="14" y1="18" x2="106" y2="18"/>
      <line class="p" x1="14" y1="36" x2="106" y2="36"/>
      <line class="p" x1="14" y1="54" x2="106" y2="54"/>
      <circle class="p" cx="60" cy="72" r="9"/>
    </g>
    <!-- flèche -->
    <path class="p" d="M448,254 h60 m-14,-9 l14,9 -14,9">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.1s" fill="freeze"/>
    </path>
    <!-- feuille / environnement -->
    <g transform="translate(528,214)">
      <path class="p" d="M40,4 C10,10 0,40 6,70 C40,68 62,44 58,10 z"/>
      <path class="p" d="M8,68 C24,50 40,36 54,26"/>
    </g>
    <text class="lg" x="450" y="336" text-anchor="middle">ne pas laisser fuir · ne pas émettre · tenir le registre</text>
  </g>

  <!-- ================= SCÈNE B : ce que fait CE module ================= -->
  <g class="scene" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.85;1" dur="4.4s" begin="4.9s" fill="remove"/>

    <text class="h2" x="450" y="76" text-anchor="middle">Ce module-ci vous apprend</text>
    <text class="h1" x="450" y="122" text-anchor="middle" style="fill:#c9451a">à vous protéger, vous</text>

    <!-- personnage qui « arrive » -->
    <g transform="translate(450,300)">
      <animateTransform attributeName="transform" type="translate" values="450,340;450,300" dur="0.7s" begin="5.1s" fill="freeze"/>
      <circle class="acc" cx="0" cy="-70" r="26"/>
      <path class="acc" d="M0,-44 v54 M0,-30 l-30,20 M0,-30 l30,20 M0,10 l-22,44 M0,10 l22,44"/>
    </g>
    <text class="lg" x="450" y="410" text-anchor="middle">Personne d'autre ne le fera à votre place.</text>
  </g>

  <!-- ================= SCÈNE C : les cinq dangers ================= -->
  <g class="scene" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.88;1" dur="6.2s" begin="9.4s" fill="remove"/>

    <text class="h2" x="450" y="66" text-anchor="middle">Cinq dangers. Cinq fiches.</text>

    <!-- 1 : l'air qui manque -->
    <g opacity="0" transform="translate(120,200)">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="9.9s" fill="freeze"/>
      <circle class="p" cx="0" cy="0" r="30"/>
      <text x="0" y="8" text-anchor="middle" style="font:700 20px Calibri;fill:#1b3a63">O₂</text>
      <line class="acc" x1="-21" y1="21" x2="21" y2="-21"/>
      <text class="pt" x="0" y="62" text-anchor="middle">l'air qui manque</text>
    </g>

    <!-- 2 : le froid brûle -->
    <g opacity="0" transform="translate(285,200)">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="10.4s" fill="freeze"/>
      <line class="p" x1="0" y1="-28" x2="0" y2="28"/>
      <line class="p" x1="-24" y1="-14" x2="24" y2="14"/>
      <line class="p" x1="-24" y1="14" x2="24" y2="-14"/>
      <path class="p" d="M0,-20 l-6,-7 M0,-20 l6,-7 M0,20 l-6,7 M0,20 l6,7"/>
      <text class="pt" x="0" y="62" text-anchor="middle">le froid brûle</text>
    </g>

    <!-- 3 : la flamme interdite -->
    <g opacity="0" transform="translate(450,200)">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="10.9s" fill="freeze"/>
      <path class="p" d="M0,-26 c-8,12 -14,17 -14,27 a14,14 0 0 0 28,0 c0,-10 -7,-13 -14,-27 z"/>
      <line class="acc" x1="-22" y1="22" x2="22" y2="-22"/>
      <text class="pt" x="0" y="62" text-anchor="middle">la flamme interdite</text>
    </g>

    <!-- 4 : ce qui éclate -->
    <g opacity="0" transform="translate(615,200)">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="11.4s" fill="freeze"/>
      <rect class="p" x="-9" y="-32" width="18" height="10" rx="2"/>
      <path class="p" d="M-16,-22 h32 a7,7 0 0 1 7,7 v36 a7,7 0 0 1 -7,7 h-32 a7,7 0 0 1 -7,-7 v-36 a7,7 0 0 1 7,-7 z"/>
      <path class="acc" d="M24,-30 l10,-8 M28,-18 l12,-3 M18,-38 l3,-9"/>
      <text class="pt" x="0" y="62" text-anchor="middle">ce qui éclate</text>
    </g>

    <!-- 5 : le risque électrique -->
    <g opacity="0" transform="translate(780,200)">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="11.9s" fill="freeze"/>
      <path class="p" d="M4,-32 l-16,34 h14 l-7,32 26,-40 h-14 z"/>
      <text class="pt" x="0" y="62" text-anchor="middle">consigner d'abord</text>
    </g>

    <text class="lg" x="450" y="330" text-anchor="middle" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="12.5s" fill="freeze"/>
      Ce qui arrive · comment ça arrive vraiment · ce qui protège
    </text>
    <text class="lg" x="450" y="360" text-anchor="middle" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="13s" fill="freeze"/>
      et le geste qu'on ne fait jamais.
    </text>
  </g>

  <!-- ================= SCÈNE D : la règle, qui reste affichée ================= -->
  <g class="scene-fin" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="15.7s" fill="freeze"/>

    <rect x="90" y="120" width="720" height="200" rx="14" fill="#eef6f1" stroke="#a9cdb8" stroke-width="2"/>
    <text class="h1" x="450" y="192" text-anchor="middle">La sécurité se démontre</text>
    <text class="h1" x="450" y="232" text-anchor="middle">et s'impose.</text>
    <text class="h2" x="450" y="286" text-anchor="middle" style="fill:#c9451a">Elle ne se découvre jamais par l'erreur.</text>
    <text class="lg" x="450" y="372" text-anchor="middle">Module à voir en premier — avant de choisir votre catégorie.</text>
  </g>
</svg>
