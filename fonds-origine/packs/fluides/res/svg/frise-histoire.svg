<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img"
     aria-label="Frise chronologique : CFC dans les années 1930, découverte du trou d'ozone en 1985, protocole de Montréal 1987, Kyoto 1997, accord de Paris 2015, amendement de Kigali 2016, F-Gas III 2024. Deux fils : ozone puis climat.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
