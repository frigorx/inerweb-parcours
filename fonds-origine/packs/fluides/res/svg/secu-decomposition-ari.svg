<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img"
     aria-label="Face à des fumées de décomposition déjà présentes dans un local : à gauche, sans protection respiratoire, la personne reste dans le nuage et tousse — fumées inhalées à bout portant. À droite, la bonne réponse en trois temps : s'éloigner de la source, alerter sans entrer seul, et ne laisser approcher qu'une personne formée portant un appareil respiratoire isolant complet. Rappel final : l'appareil respiratoire isolant protège l'intervenant formé, il ne remplace jamais l'éloignement de la source et l'évacuation.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
    <cc:Work rdf:about="">
      <dc:title>Face à des fumées de décomposition déjà présentes dans un local : à gauche, sans protection respiratoire, la personne reste dans le nuage et</dc:title>
      <dc:creator><cc:Agent><dc:title>inerWeb — F. Henninot</dc:title></cc:Agent></dc:creator>
      <dc:rights><cc:Agent><dc:title>© 2026 inerWeb — F. Henninot — tous droits réservés sur l’illustration</dc:title></cc:Agent></dc:rights>
      <dc:publisher><cc:Agent><dc:title>inerWeb</dc:title></cc:Agent></dc:publisher>
      <dc:date>2026</dc:date>
      <dc:identifier>inerweb.fh@gmail.com</dc:identifier>
      <cc:license rdf:resource="https://creativecommons.org/licenses/by-nc-nd/4.0/"/>
    </cc:Work>
    <cc:License rdf:about="https://creativecommons.org/licenses/by-nc-nd/4.0/">
      <cc:permits rdf:resource="http://creativecommons.org/ns#Reproduction"/>
      <cc:permits rdf:resource="http://creativecommons.org/ns#Distribution"/>
      <cc:requires rdf:resource="http://creativecommons.org/ns#Notice"/>
      <cc:requires rdf:resource="http://creativecommons.org/ns#Attribution"/>
      <cc:prohibits rdf:resource="http://creativecommons.org/ns#CommercialUse"/>
      <cc:prohibits rdf:resource="http://creativecommons.org/ns#DerivativeWorks"/>
    </cc:License>
  </rdf:RDF>
</metadata>
  <title>Fumées de décomposition : l'ARI protège l'intervenant formé, pas le chantier</title>
  <style>
    .t   { font:700 19px Calibri,Segoe UI,sans-serif; fill:#1b3a63; }
    .st  { font:700 15px Calibri,Segoe UI,sans-serif; fill:#1b3a63; }
    .lg  { font:400 13.5px Calibri,Segoe UI,sans-serif; fill:#4a5b6e; }
    .bad { font:700 15px Calibri,Segoe UI,sans-serif; fill:#c9451a; }
    .p   { fill:none; stroke:#1b3a63; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
    .acc { fill:none; stroke:#c9451a; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
    /* Au repos, l'image est complète : l'animation ne fait que la mettre en scène. */
    @media print { .final { opacity: 1 !important; } }
  </style>

  <rect width="900" height="320" fill="#ffffff"/>
  <text class="t" x="30" y="32">Des fumées de décomposition sont déjà là : qui peut approcher, et comment</text>

  <!-- ===== SANS PROTECTION ===== -->
  <g transform="translate(30,52)">
    <rect x="0" y="0" width="400" height="192" rx="8" fill="#fdf1ed" stroke="#e8b9a8" stroke-width="1.5"/>

    <!-- le nuage de fumées, déjà présent -->
    <g opacity="0.85">
      <path class="acc" d="M70,66 q-14,-16 2,-28 q10,-16 28,-6 q6,-16 24,-10 q18,-4 20,14 q18,-2 18,16 q10,14 -8,22 q-4,14 -22,10 q-14,10 -28,-2 q-18,6 -26,-8 q-16,0 -8,-16 z"/>
    </g>
    <text class="bad" x="105" y="42" text-anchor="middle" style="font-size:12.5px">fumées présentes</text>

    <!-- la personne, sans protection, reste dans le nuage ; la toux part du visage -->
    <g transform="translate(95,110)">
      <circle class="acc" cx="0" cy="0" r="15"/>
      <path class="acc" d="M-4,20 v30"/>
      <path class="acc" d="M-4,28 l-16,12 M-4,28 l16,9"/>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.4s" fill="freeze"/>
        <path class="acc" d="M14,-2 q11,-3 15,7 M15,6 q13,-1 17,9" opacity="0.85"/>
      </g>
    </g>

    <g class="final" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="2.2s" fill="freeze"/>
      <text class="bad" x="238" y="112" text-anchor="middle">fumées inhalées</text>
      <text class="bad" x="238" y="132" text-anchor="middle">à bout portant</text>
      <text class="lg"  x="238" y="154" text-anchor="middle">lésions pulmonaires possibles</text>
    </g>

    <text class="bad final" x="200" y="176" text-anchor="middle" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3s" fill="freeze"/>
      ✗ rester ou entrer sans protection respiratoire
    </text>
  </g>

  <!-- ===== RÉPONSE JUSTE ===== -->
  <g transform="translate(470,52)">
    <rect x="0" y="0" width="400" height="192" rx="8" fill="#eef6f1" stroke="#a9cdb8" stroke-width="1.5"/>

    <!-- même nuage, déporté hors de la colonne des étapes -->
    <g opacity="0.45" transform="translate(230,0)">
      <path class="acc" d="M70,66 q-14,-16 2,-28 q10,-16 28,-6 q6,-16 24,-10 q18,-4 20,14 q18,-2 18,16 q10,14 -8,22 q-4,14 -22,10 q-14,10 -28,-2 q-18,6 -26,-8 q-16,0 -8,-16 z"/>
    </g>

    <g class="final" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.8s" fill="freeze"/>
      <g transform="translate(24,24)">
        <circle cx="10" cy="10" r="11" fill="#1b3a63"/>
        <text x="10" y="15" text-anchor="middle" style="font:700 12px Calibri;fill:#fff">1</text>
        <text class="st" x="30" y="15">S'éloigner de la source</text>
      </g>
    </g>

    <g class="final" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="4.6s" fill="freeze"/>
      <g transform="translate(24,60)">
        <circle cx="10" cy="10" r="11" fill="#1b3a63"/>
        <text x="10" y="15" text-anchor="middle" style="font:700 12px Calibri;fill:#fff">2</text>
        <text class="st" x="30" y="15">Alerter, ne jamais entrer seul</text>
      </g>
    </g>

    <g class="final" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="5.4s" fill="freeze"/>
      <g transform="translate(24,96)">
        <circle cx="10" cy="10" r="11" fill="#1b3a63"/>
        <text x="10" y="15" text-anchor="middle" style="font:700 12px Calibri;fill:#fff">3</text>
        <text class="st" x="30" y="15">Seule une personne formée,</text>
      </g>
      <text class="st" x="54" y="132">avec ARI, peut approcher</text>
    </g>

    <!-- la personne formée, avec ARI, hors du nuage -->
    <g class="final" opacity="0" transform="translate(305,140)">
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="6.2s" fill="freeze"/>
      <circle class="p" cx="0" cy="0" r="15"/>
      <rect class="p" x="-9" y="-6" width="18" height="14" rx="4"/>
      <path class="p" d="M-4,20 v12"/>
      <rect class="p" x="6" y="16" width="9" height="17" rx="3"/>
      <path class="p" d="M11,16 v-3"/>
    </g>
    <text class="lg final" x="305" y="176" text-anchor="middle" opacity="0" style="font-size:11.5px">
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="6.2s" fill="freeze"/>
      ARI + protection faciale
    </text>
  </g>

  <!-- bandeau -->
  <g class="final" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.7s" begin="7s" fill="freeze"/>
    <rect x="30" y="258" width="840" height="42" rx="8" fill="#ffffff" stroke="#e8b9a8" stroke-width="1.5"/>
    <text class="bad" x="50" y="284">RAPPEL :</text>
    <text class="lg" x="126" y="284">l'ARI protège l'intervenant formé — il ne remplace jamais l'éloignement de la source et l'évacuation.</text>
  </g>
</svg>
