<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" role="img"
     aria-label="Matrice complète des classes de sécurité NF EN 378 : toxicité en lignes (A faible, B plus élevée), inflammabilité en colonnes (1 aucune flamme, 2L faible et lente, 2 inflammable, 3 très inflammable). A1 : CO2, dangers pression et anoxie. A2L : R-32 et R-1234yf. A2 : R-152a. A3 : R-290. B1 : R-123. B2L : ammoniac. B2 et B3 : aucun fluide courant du parc français.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
