<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img"
     aria-label="Les cinq étapes de la consignation électrique, qui s'allument dans l'ordre : séparer en coupant l'alimentation de façon visible, condamner en verrouillant l'organe de coupure, identifier le bon circuit, vérifier l'absence de tension au VAT, et mettre à la terre et en court-circuit quand une tension peut revenir. Le VAT se teste avant et après usage sur une source connue : un appareil en panne affiche l'absence de tension quoi qu'il arrive.">
  <title>La consignation électrique en cinq étapes</title>
  <style>
    .t  { font:700 19px Calibri,Segoe UI,sans-serif; fill:#1b3a63; }
    .n  { font:700 16px Calibri,Segoe UI,sans-serif; fill:#ffffff; }
    .et { font:700 15px Calibri,Segoe UI,sans-serif; fill:#1b3a63; }
    .lg { font:400 13px Calibri,Segoe UI,sans-serif; fill:#4a5b6e; }
    .p  { fill:none; stroke:#1b3a63; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
    .acc{ fill:none; stroke:#c9451a; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
    /* L'état AU REPOS est l'image complète ; l'animation ne fait que l'allumer
       étape par étape. Sans animation, tout est là — rien n'est perdu. */
    @media print { .final { opacity: 1 !important; } }
  </style>

  <rect width="900" height="300" fill="#ffffff"/>
  <text class="t" x="30" y="32">Consigner : cinq étapes, toujours dans cet ordre</text>

  <!-- le fil se trace -->
  <line x1="70" y1="120" x2="830" y2="120" stroke="#c9d4de" stroke-width="3"
        stroke-dasharray="760" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="760;0" dur="3.4s" begin="0s" fill="freeze"/>
  </line>

  <!-- 1 SÉPARER -->
  <g class="final" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.4s" fill="freeze"/>
    <g transform="translate(70,120)">
      <circle cx="0" cy="0" r="19" fill="#1b3a63"/>
      <text class="n" x="0" y="6" text-anchor="middle">1</text>
      <g transform="translate(-24,-88)">
        <rect class="p" x="0" y="0" width="48" height="56" rx="4"/>
        <line class="p" x1="24" y1="14" x2="24" y2="30"/>
        <line class="acc" x1="24" y1="30" x2="38" y2="44"/>
        <circle cx="24" cy="12" r="3" fill="#1b3a63"/>
      </g>
    </g>
    <text class="et" x="70" y="168" text-anchor="middle">Séparer</text>
    <text class="lg" x="70" y="188" text-anchor="middle">couper de façon</text>
    <text class="lg" x="70" y="204" text-anchor="middle">visible et certaine</text>
  </g>

  <!-- 2 CONDAMNER -->
  <g class="final" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.1s" fill="freeze"/>
    <g transform="translate(260,120)">
      <circle cx="0" cy="0" r="19" fill="#1b3a63"/>
      <text class="n" x="0" y="6" text-anchor="middle">2</text>
      <g transform="translate(-22,-86)">
        <rect class="p" x="0" y="22" width="44" height="32" rx="4"/>
        <path class="p" d="M9,22 v-9 a13,13 0 0 1 26,0 v9"/>
        <circle cx="22" cy="38" r="4" fill="#1b3a63"/>
      </g>
    </g>
    <text class="et" x="260" y="168" text-anchor="middle">Condamner</text>
    <text class="lg" x="260" y="188" text-anchor="middle">verrouiller : personne</text>
    <text class="lg" x="260" y="204" text-anchor="middle">ne peut réenclencher</text>
  </g>

  <!-- 3 IDENTIFIER -->
  <g class="final" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.8s" fill="freeze"/>
    <g transform="translate(450,120)">
      <circle cx="0" cy="0" r="19" fill="#1b3a63"/>
      <text class="n" x="0" y="6" text-anchor="middle">3</text>
      <g transform="translate(-24,-88)">
        <rect class="p" x="0" y="4" width="34" height="46" rx="3"/>
        <line class="p" x1="7" y1="16" x2="27" y2="16"/>
        <line class="p" x1="7" y1="26" x2="27" y2="26"/>
        <circle class="acc" cx="34" cy="40" r="12"/>
        <line class="acc" x1="43" y1="49" x2="52" y2="58"/>
      </g>
    </g>
    <text class="et" x="450" y="168" text-anchor="middle">Identifier</text>
    <text class="lg" x="450" y="188" text-anchor="middle">est-ce bien CE</text>
    <text class="lg" x="450" y="204" text-anchor="middle">circuit-là ?</text>
  </g>

  <!-- 4 VÉRIFIER — l'étape qui prouve : elle clignote une fois -->
  <g class="final" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.5s" fill="freeze"/>
    <g transform="translate(640,120)">
      <circle cx="0" cy="0" r="19" fill="#c9451a"/>
      <text class="n" x="0" y="6" text-anchor="middle">4</text>
      <circle cx="0" cy="0" r="19" fill="none" stroke="#c9451a" stroke-width="3" opacity="0">
        <animate attributeName="r" values="19;34" dur="1.1s" begin="3.1s" fill="remove"/>
        <animate attributeName="opacity" values="0.9;0" dur="1.1s" begin="3.1s" fill="remove"/>
      </circle>
      <g transform="translate(-22,-90)">
        <rect class="acc" x="4" y="10" width="36" height="48" rx="4"/>
        <rect class="acc" x="11" y="18" width="22" height="14" rx="2"/>
        <circle cx="17" cy="44" r="3.5" fill="#c9451a"/>
        <circle cx="28" cy="44" r="3.5" fill="#c9451a"/>
        <line class="acc" x1="12" y1="10" x2="12" y2="2"/>
        <line class="acc" x1="32" y1="10" x2="32" y2="2"/>
      </g>
    </g>
    <text class="et" x="640" y="168" text-anchor="middle" style="fill:#c9451a">Vérifier au VAT</text>
    <text class="lg" x="640" y="188" text-anchor="middle">l'absence de tension —</text>
    <text class="lg" x="640" y="204" text-anchor="middle">c'est la preuve</text>
  </g>

  <!-- 5 MALT -->
  <g class="final" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.2s" fill="freeze"/>
    <g transform="translate(830,120)">
      <circle cx="0" cy="0" r="19" fill="#1b3a63"/>
      <text class="n" x="0" y="6" text-anchor="middle">5</text>
      <g transform="translate(-20,-84)">
        <line class="p" x1="20" y1="6" x2="20" y2="32"/>
        <line class="p" x1="6"  y1="32" x2="34" y2="32"/>
        <line class="p" x1="11" y1="41" x2="29" y2="41"/>
        <line class="p" x1="16" y1="50" x2="24" y2="50"/>
      </g>
    </g>
    <text class="et" x="830" y="168" text-anchor="middle">Mettre à la terre</text>
    <text class="lg" x="830" y="188" text-anchor="middle">quand une tension</text>
    <text class="lg" x="830" y="204" text-anchor="middle">peut revenir</text>
  </g>

  <!-- bandeau VAT -->
  <g class="final" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.7s" begin="4.3s" fill="freeze"/>
    <rect x="30" y="228" width="840" height="52" rx="8" fill="#fdf1ed" stroke="#e8b9a8" stroke-width="1.5"/>
    <text x="50" y="250" style="font:700 14px Calibri;fill:#c9451a">Le VAT se teste AVANT et APRÈS, sur une source que l'on sait sous tension.</text>
    <text class="lg" x="50" y="270">S'il marchait au premier essai et plus au second, tout ce qu'il a mesuré entre les deux ne vaut rien. Un appareil mort affiche « pas de tension » quoi qu'il arrive.</text>
  </g>
</svg>
