      <cc:requires rdf:resource="http://creativecommons.org/ns#Attribution"/>
      <cc:prohibits rdf:resource="http://creativecommons.org/ns#CommercialUse"/>
      <cc:prohibits rdf:resource="http://creativecommons.org/ns#DerivativeWorks"/>
    </cc:License>
  </rdf:RDF>
</metadata>
  <title>Préparation de chantier : quatre temps avant de toucher</title>
  <style>
    .t   { font:700 19px Calibri,Segoe UI,sans-serif; fill:#1b3a63; }
    .n   { font:700 15px Calibri,Segoe UI,sans-serif; fill:#ffffff; }
    .st  { font:700 14.5px Calibri,Segoe UI,sans-serif; fill:#1b3a63; }
    .lg  { font:400 13px Calibri,Segoe UI,sans-serif; fill:#4a5b6e; }
    .p   { fill:none; stroke:#1b3a63; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
    .acc { fill:none; stroke:#c9451a; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
  </style>

  <rect width="880" height="300" fill="#ffffff"/>
  <text class="t" x="30" y="32">Avant de toucher quoi que ce soit</text>

  <!-- fil -->
  <line x1="118" y1="132" x2="762" y2="132" stroke="#c9d4de" stroke-width="3"/>

  <!-- 1 RECONNAÎTRE -->
  <g transform="translate(118,132)">
    <circle cx="0" cy="0" r="18" fill="#1b3a63"/>
    <text class="n" x="0" y="6" text-anchor="middle">1</text>
    <g transform="translate(-24,-82)">
      <circle class="p" cx="20" cy="20" r="15"/>
      <line class="p" x1="31" y1="31" x2="44" y2="44"/>
    </g>
  </g>
  <text class="st" x="118" y="176" text-anchor="middle">Reconnaître</text>
  <text class="lg" x="118" y="198" text-anchor="middle">quel fluide, quel local,</text>
  <text class="lg" x="118" y="216" text-anchor="middle">quelles issues, quelle</text>
  <text class="lg" x="118" y="234" text-anchor="middle">ventilation</text>

  <!-- 2 IDENTIFIER LES RISQUES -->
  <g transform="translate(333,132)">
    <circle cx="0" cy="0" r="18" fill="#c9451a"/>
    <text class="n" x="0" y="6" text-anchor="middle">2</text>
    <g transform="translate(-24,-84)">
      <path d="M24,6 L44,42 L4,42 Z" fill="#ffdf00" stroke="#111" stroke-width="2.4" stroke-linejoin="round"/>
      <text x="24" y="37" text-anchor="middle" style="font:700 17px Calibri;fill:#111">!</text>
    </g>
  </g>
  <text class="st" x="333" y="176" text-anchor="middle" style="fill:#c9451a">Identifier les risques</text>
  <text class="lg" x="333" y="198" text-anchor="middle">ceux du jour, pas ceux</text>
  <text class="lg" x="333" y="216" text-anchor="middle">du manuel — et les</text>
  <text class="lg" x="333" y="234" text-anchor="middle">supprimer si possible</text>

  <!-- 3 SE PROTÉGER -->
  <g transform="translate(548,132)">
    <circle cx="0" cy="0" r="18" fill="#1b3a63"/>
    <text class="n" x="0" y="6" text-anchor="middle">3</text>
    <g transform="translate(-26,-80)">
      <rect class="p" x="0" y="10" width="18" height="13" rx="3"/>
      <rect class="p" x="22" y="10" width="18" height="13" rx="3"/>
      <line class="p" x1="18" y1="17" x2="22" y2="17"/>
      <path class="p" d="M8,50 v-12 a2.5,2.5 0 0 1 5,0 v-8 a2.5,2.5 0 0 1 5,0 v7 a2.5,2.5 0 0 1 5,0 v1 a2.5,2.5 0 0 1 5,0 v10 a6,6 0 0 1 -6,6 h-8 a6,6 0 0 1 -6,-4 z"/>
    </g>
  </g>
  <text class="st" x="548" y="176" text-anchor="middle">Se protéger</text>
  <text class="lg" x="548" y="198" text-anchor="middle">les EPI découlent des</text>
  <text class="lg" x="548" y="216" text-anchor="middle">risques — et se mettent</text>
  <text class="lg" x="548" y="234" text-anchor="middle">AVANT de commencer</text>

  <!-- 4 PRÉPARER -->
  <g transform="translate(762,132)">
    <circle cx="0" cy="0" r="18" fill="#1b3a63"/>
    <text class="n" x="0" y="6" text-anchor="middle">4</text>
    <g transform="translate(-26,-80)">
      <rect class="p" x="2" y="16" width="46" height="30" rx="4"/>
      <line class="p" x1="2" y1="26" x2="48" y2="26"/>
      <path class="p" d="M18,16 v-6 a7,7 0 0 1 14,0 v6"/>
    </g>
  </g>
  <text class="st" x="762" y="176" text-anchor="middle">Préparer</text>
  <text class="lg" x="762" y="198" text-anchor="middle">délimiter la zone,</text>
  <text class="lg" x="762" y="216" text-anchor="middle">sortir le matériel,</text>
  <text class="lg" x="762" y="234" text-anchor="middle">vérifier qu'il est bon</text>

  <!-- bandeau -->
  <rect x="30" y="254" width="820" height="34" rx="8" fill="#eef6f1" stroke="#a9cdb8" stroke-width="1.5"/>
  <text x="48" y="276" style="font:700 14px Calibri;fill:#1b3a63">Ce qui n'a pas été prévu ici se découvrira au pire moment.<tspan class="lg" dx="10">La sécurité se démontre et s'impose : elle ne se découvre jamais par l'erreur.</tspan></text>
</svg>
