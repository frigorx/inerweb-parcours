<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img"
     aria-label="La préparation de chantier en quatre temps, avant de toucher quoi que ce soit. Un : reconnaître le lieu, quel fluide, quel local, quelles issues, quelle ventilation. Deux : identifier les risques du jour et les supprimer quand c'est possible. Trois : choisir les équipements de protection selon ces risques, et les mettre avant de commencer. Quatre : délimiter la zone et préparer le matériel. La règle : ce qui n'a pas été prévu se découvre au pire moment.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
    <cc:Work rdf:about="">
      <dc:title>La préparation de chantier en quatre temps, avant de toucher quoi que ce soit</dc:title>
      <dc:creator><cc:Agent><dc:title>inerWeb — F. Henninot</dc:title></cc:Agent></dc:creator>
