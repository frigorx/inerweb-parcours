<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img"
     aria-label="Animation du domaine d'explosivité d'un gaz inflammable. Un curseur parcourt lentement l'axe des concentrations de gaz dans l'air. Il traverse d'abord la zone trop pauvre, où une étincelle ne déclenche rien. Quand il franchit la limite inférieure d'explosivité, le domaine d'explosivité s'illumine en rouge et une étincelle apparaît au sommet du curseur : c'est le moment dangereux. Le curseur franchit ensuite la limite supérieure et entre dans la zone trop riche, où il manque d'air pour entretenir la combustion. En dessous, l'échelle de l'explosimètre se remplit à mesure que le curseur avance, mais elle bute à cent pour cent de la limite inférieure et n'avance plus, alors que le curseur, lui, entre dans le domaine : l'échelle de l'appareil s'arrête exactement là où commence le danger, parce qu'elle affiche la marge qui reste et non la quantité de gaz. Son alarme, elle, se déclenche bien avant cette butée. L'appareil se règle pour un gaz donné : réglé pour un autre, il affiche un chiffre faux. Les valeurs de ces limites sont propres à chaque fluide et se lisent sur sa fiche de données de sécurité. Le R-290 utilisé en froid n'a aucune odeur : le nez n'avertit de rien.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
    <cc:Work rdf:about="">
      <dc:title>Animation du domaine d'explosivité d'un gaz inflammable</dc:title>
