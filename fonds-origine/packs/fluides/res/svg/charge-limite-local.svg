<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img"
     aria-label="Trois locaux de volumes croissants abritent la même installation au R-290, classe A3, et la même fuite. Animation : le gaz forme une nappe au sol, qui envahit le petit local et ne fait qu'une mince couche dans le grand. Sous chaque local, une jauge montre que la charge admissible grandit avec le volume. En bas, sur une bande sans graduation chiffrée, le curseur du petit local entre dans le domaine d'explosivité quand celui du grand local reste en zone trop pauvre.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
    <cc:Work rdf:about="">
      <dc:title>Trois locaux de volumes croissants abritent la même installation au R-290, classe A3, et la même fuite</dc:title>
      <dc:creator><cc:Agent><dc:title>inerWeb — F. Henninot</dc:title></cc:Agent></dc:creator>
