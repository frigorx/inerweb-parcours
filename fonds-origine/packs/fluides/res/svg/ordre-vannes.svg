<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img"
 aria-label="L'ordre des vannes à la déconnexion. On voit l'installation et ses deux vannes de service (aspiration, liquide), le manifold avec ses manomètres et ses vannes, le raccord du flexible, puis le groupe de récupération et la bouteille avec sa vanne. L'animation allume les étapes une à une : 1 fermer côté circuit puis côté appareil, 2 laisser la pression se stabiliser en observant le manomètre dont l'aiguille s'immobilise, 3 desserrer lentement le raccord par petites touches, 4 récupérer par l'appareil le fluide resté dans le flexible, 5 déconnecter seulement quand la pression est retombée. À la fin tout est allumé.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
