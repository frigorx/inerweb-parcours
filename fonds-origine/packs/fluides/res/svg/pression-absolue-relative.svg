<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 466" role="img"
     aria-label="Deux règles verticales graduées côte à côte. À gauche l'échelle relative, celle du manomètre : son zéro est la pression atmosphérique. À droite l'échelle absolue, celle des tables : son zéro est le vide absolu, une graduation plus bas. Les deux échelles sont décalées d'exactement une graduation, soit un bar. À gauche est dessiné un manomètre, aiguille sur zéro : à zéro relatif, il y a déjà un bar absolu. L'animation fait monter un curseur le long des deux échelles à la fois : les deux colonnes de lecture montent ensemble, celle de l'échelle absolue gardant toujours en pied le bar supplémentaire, en orange. Oublier ce bar fausse toute lecture de température de saturation.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
    <cc:Work rdf:about="">
      <dc:title>Deux règles verticales graduées côte à côte</dc:title>
