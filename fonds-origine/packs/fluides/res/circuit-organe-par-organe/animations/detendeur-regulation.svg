<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img"
     aria-label="La boucle de régulation du détendeur thermostatique : l'évaporateur en bas, le détendeur à gauche en entrée d'évaporateur, le bulbe fixé sur la ligne d'aspiration en sortie d'évaporateur et le capillaire remontant vers la tête du détendeur. L'animation tourne en boucle en quatre temps : la charge thermique augmente et la surchauffe monte sur l'échelle ; le bulbe se réchauffe et la pression du capillaire bombe la membrane ; la membrane pousse la tige, le pointeau quitte son siège et le débit augmente ; la surchauffe redescend, le pointeau se rapproche de son siège, et la boucle recommence.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
    <cc:Work rdf:about="">
      <dc:title>La boucle de régulation du détendeur thermostatique : l'évaporateur en bas, le détendeur à gauche en entrée d'évaporateur, le bulbe fixé sur</dc:title>
