<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img"
     aria-label="Le registre de l'installation, présenté comme une page à quatre sections : les quantités de fluide (en place, ajouté, récupéré, avec nature, origine et destination) ; les contrôles d'étanchéité (date, méthode, résultat, opérateur et attestation) ; les fuites (localisation, réparation, contrôle de suivi) ; la fin de vie (mise à l'arrêt, devenir du fluide). Les enregistrements se conservent au moins 5 ans — article 7 du règlement (UE) 2024/573.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
    <cc:Work rdf:about="">
      <dc:title>Le registre de l'installation, présenté comme une page à quatre sections : les quantités de fluide (en place, ajouté, récupéré, avec nature,</dc:title>
