<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 464" role="img"
     aria-label="Le calcul en tonnes équivalent CO2, sur l'exemple de la planche PRP : fuir un kilogramme de R-404A, dont le PRP vaut trois mille neuf cent vingt-deux, revient à relâcher environ trois virgule neuf tonnes équivalent CO2. C'est la charge multipliée par le PRP qui fait la conversion, et c'est ce chiffre que la réglementation regarde pour classer la sévérité d'une installation et commander les obligations de contrôle d'étanchéité.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
    <cc:Work rdf:about="">
      <dc:title>Le calcul en tonnes équivalent CO2, sur l'exemple de la planche PRP : fuir un kilogramme de R-404A, dont le PRP vaut trois mille neuf cent v</dc:title>
      <dc:creator><cc:Agent><dc:title>inerWeb — F. Henninot</dc:title></cc:Agent></dc:creator>
