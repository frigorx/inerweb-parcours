<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img"
     aria-label="Le geste de récupération en deux temps. Temps un : phase liquide d'abord, trait plein épais — rapide, la plus grande partie de la charge y passe. Temps deux : phase vapeur ensuite, trait fin tireté — pour aller chercher ce qui reste. Pendant tout le transfert, on surveille la pesée et la pression de la bouteille. C'est l'ordre courant : la station et sa notice commandent.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
    <cc:Work rdf:about="">
      <dc:title>Le geste de récupération en deux temps</dc:title>
      <dc:creator><cc:Agent><dc:title>inerWeb — F. Henninot</dc:title></cc:Agent></dc:creator>
