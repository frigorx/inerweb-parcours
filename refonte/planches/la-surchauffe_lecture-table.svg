<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img"
     aria-label="La lecture d'une table de saturation : le manomètre donne la pression, l'en-tête de la table dit si elle attend une pression absolue ou relative, puis la ligne donne la température. Ajouter un bar machinalement est barré : interdit.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
    <cc:Work rdf:about="">
      <dc:title>La lecture d'une table de saturation : le manomètre donne la pression, l'en-tête de la table dit si elle attend une pression absolue ou rela</dc:title>
