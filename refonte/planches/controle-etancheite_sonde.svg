<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img"
     aria-label="Un raccord sur une tuyauterie, une sonde de détecteur passée lentement par en dessous : le gaz, plus lourd que l'air, tombe. À droite, un ventilateur barré d'une croix : sans courant d'air. En bas, la notice du détecteur : c'est elle qui donne la vitesse de passage, et le contrôle avant usage se fait avec un gaz de référence.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
    <cc:Work rdf:about="">
      <dc:title>Un raccord sur une tuyauterie, une sonde de détecteur passée lentement par en dessous : le gaz, plus lourd que l'air, tombe</dc:title>
