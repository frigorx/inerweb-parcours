<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img"
     aria-label="Diagramme pression-enthalpie : un dôme de saturation en forme de cloche, avec la zone liquide à gauche, la zone vapeur à droite et le mélange liquide plus vapeur dessous. Le cycle frigorifique dessine une figure fermée en quatre transformations : évaporation horizontale en bas sur la ligne basse pression, compression oblique qui monte vers la droite, condensation horizontale en haut sur la ligne haute pression, détente verticale qui redescend à gauche.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
    <cc:Work rdf:about="">
      <dc:title>Diagramme pression-enthalpie : un dôme de saturation en forme de cloche, avec la zone liquide à gauche, la zone vapeur à droite et le mélang</dc:title>
