<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img"
     aria-label="À gauche, la classe lue sur l'étiquette. Trois flèches partent vers trois cadres : la charge dans le local ; l'outillage autorisé, point chaud, détecteur, électricité ; la ventilation et la conduite en cas de fuite. En dessous, un bandeau : la classe ne décide pas seule, la notice de l'appareil et les règles du local précisent le tout.">
