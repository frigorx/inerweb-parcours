<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img"
     aria-label="R-22 ne montre que deux chiffres : on ajoute un zéro devant et on lit R-022, soit trois cases zéro, deux, deux. Le zéro ne change pas le fluide, il complète les cases.">
