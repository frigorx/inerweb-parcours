  <title>Trois cases, toujours trois</title>
  <style>
    .t   { font:700 20px Calibri,'Segoe UI',sans-serif; fill:#1b3a63; }
    .st  { font:700 15px Calibri,'Segoe UI',sans-serif; fill:#1b3a63; }
    .lg  { font:400 13.5px Calibri,'Segoe UI',sans-serif; fill:#637285; }
    .acc { font:700 13.5px Calibri,'Segoe UI',sans-serif; fill:#c9451a; }
    .chif{ font:700 26px Consolas,monospace; fill:#1b3a63; }
    .zero{ font:700 26px Consolas,monospace; fill:#c9451a; }
    .code{ font:700 22px Consolas,monospace; fill:#1b3a63; }
    .p   { fill:none; stroke:#1b3a63; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
    .fl  { fill:none; stroke:#3d7fca; stroke-width:2.4; stroke-linecap:round; marker-end:url(#fleche); }
    .dash{ fill:none; stroke:#8fa3b8; stroke-width:1.6; stroke-dasharray:5 5; }
  </style>
  <defs>
    <marker id="fleche" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#3d7fca"/>
    </marker>
  </defs>

  <rect width="700" height="400" fill="#fffdf8"/>
  <text class="t" x="30" y="36">La méthode a besoin de trois cases</text>

  <!-- ===== R-22 : le zéro ajouté ===== -->
  <text class="code" x="60" y="196">R-22</text>
  <path class="fl" d="M135,188 h95"/>
  <text class="acc" x="182" y="172" text-anchor="middle">un zéro devant</text>
  <text class="code" x="250" y="196">R-<tspan class="zero">0</tspan>22</text>
  <path class="fl" d="M355,188 h60"/>
  <!-- trois cases -->
  <g>
    <rect class="p" x="430" y="160" width="52" height="52" fill="#fffdf8"/>
    <rect class="p" x="492" y="160" width="52" height="52" fill="#fffdf8"/>
    <rect class="p" x="554" y="160" width="52" height="52" fill="#fffdf8"/>
    <text class="zero" x="456" y="196" text-anchor="middle">0</text>
    <text class="chif" x="518" y="196" text-anchor="middle">2</text>
    <text class="chif" x="580" y="196" text-anchor="middle">2</text>
  </g>
  <text class="lg" x="518" y="236" text-anchor="middle">trois cases bien nettes</text>

  <!-- ===== Morale ===== -->
  <path class="dash" d="M40,332 h620"/>
  <text class="st" x="350" y="362" text-anchor="middle">Le zéro ajouté ne change pas le fluide : il complète les cases.</text>
  <text class="lg" x="350" y="384" text-anchor="middle">Méthode valable pour la famille décodée ici : les halocarbures les plus courants.</text>
</svg>
