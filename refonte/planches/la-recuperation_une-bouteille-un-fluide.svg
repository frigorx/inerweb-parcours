<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img"
     aria-label="À gauche, le bon geste : chaque fluide va dans sa propre bouteille, une bouteille égale un fluide. À droite, la faute : deux fluides versés dans la même bouteille donnent un mélange qui n'est plus identifiable.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
    <cc:Work rdf:about="">
      <dc:title>À gauche, le bon geste : chaque fluide va dans sa propre bouteille, une bouteille égale un fluide</dc:title>
