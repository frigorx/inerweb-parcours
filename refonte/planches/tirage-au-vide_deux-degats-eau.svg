<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img"
     aria-label="Deux dégâts possibles de l'eau restée dans le circuit : au détendeur, point froid, elle peut geler et former un bouchon de glace ; dans l'huile, elle peut réagir et produire des acides qui attaquent les vernis du moteur. Le vide profond évite les deux.">
