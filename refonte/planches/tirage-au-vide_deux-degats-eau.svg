           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
    <cc:Work rdf:about="">
      <dc:title>Deux dégâts possibles de l'eau restée dans le circuit : au détendeur, point froid, elle peut geler et former un bouchon de glace ; dans l'hu</dc:title>
