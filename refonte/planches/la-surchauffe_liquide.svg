<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img"
     aria-label="Deux cylindres de compresseur côte à côte : rempli de gaz, le piston finit sa course, le volume diminue. Rempli de liquide, pratiquement incompressible, les efforts montent brutalement sur le clapet, la bielle et la culasse.">
