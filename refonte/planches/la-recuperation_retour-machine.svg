<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img"
     aria-label="Décision après récupération : le fluide est-il encore autorisé à l'entretien ? Oui — trait plein vert : il peut retourner dans SA machine, celle d'où il sort. Non, fluide sous restriction, PRP supérieur ou égal à 2500 comme le R-404A — trait tireté rouge : il ne retourne pas dans le circuit, il part en filière avec son papier. Le réflexe : vérifier le statut du fluide avant de remettre, sur l'étiquette et la documentation.">
  <title>Le fluide récupéré retourne-t-il dans sa machine ?</title>
  <style>
    .t   { font:700 20px "Trebuchet MS",Calibri,Arial,sans-serif; fill:#1b3a63; }
    .st  { font:700 15px Calibri,"Segoe UI",Arial,sans-serif; fill:#1b3a63; }
    .lg  { font:400 13.5px Calibri,"Segoe UI",Arial,sans-serif; fill:#637285; }
    .ok  { font:700 14.5px Calibri,"Segoe UI",Arial,sans-serif; fill:#1e7e54; }
    .ko  { font:700 14.5px Calibri,"Segoe UI",Arial,sans-serif; fill:#c0392b; }
    .acc { font:700 14px Calibri,"Segoe UI",Arial,sans-serif; fill:#c9451a; }
    .b   { fill:#fffdf8; stroke:#1b3a63; stroke-width:2.4; }
    .flok{ fill:none; stroke:#1e7e54; stroke-width:3.4; stroke-linecap:round; }
    .flko{ fill:none; stroke:#c0392b; stroke-width:3; stroke-linecap:round; stroke-dasharray:8 6; }
  </style>

  <rect width="700" height="400" fill="#fffdf8"/>
  <text class="t" x="30" y="36">Remettre le fluide récupéré ? On vérifie son statut.</text>

  <!-- bouteille récupérée -->
  <rect class="b" x="80" y="130" width="66" height="110" rx="10"/>
  <rect x="88" y="164" width="50" height="28" fill="#fffdf8" stroke="#1b3a63" stroke-width="1.3"/>
  <text class="st" x="113" y="183" text-anchor="middle" style="font-size:11.5px">RÉCUP.</text>
  <text class="lg" x="113" y="262" text-anchor="middle">fluide tout juste</text>
  <text class="lg" x="113" y="279" text-anchor="middle">récupéré</text>

  <!-- question -->
  <rect x="196" y="150" width="180" height="70" rx="10" fill="#fffdf8" stroke="#1b3a63" stroke-width="2.6"/>
  <text class="st" x="286" y="178" text-anchor="middle">Encore autorisé</text>
  <text class="st" x="286" y="198" text-anchor="middle">à l'entretien ?</text>
  <path d="M150,185 h40" fill="none" stroke="#1b3a63" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M196,185 l-12,-7 v14 z" fill="#1b3a63"/>

  <!-- branche OUI -->
  <path class="flok" d="M380,168 q60,-38 120,-40"/>
  <path d="M506,127 l-15,-3 6,13 z" fill="#1e7e54"/>
  <text class="ok" x="420" y="118">OUI — trait plein</text>
  <rect x="512" y="70" width="160" height="96" rx="8" fill="none" stroke="#1e7e54" stroke-width="2.8"/>
  <text class="ok" x="592" y="98" text-anchor="middle">retour dans</text>
  <text class="ok" x="592" y="118" text-anchor="middle">SA machine</text>
  <text class="lg" x="592" y="144" text-anchor="middle">celle d'où il sort —</text>
  <text class="lg" x="592" y="160" text-anchor="middle">le geste courant</text>

  <!-- branche NON -->
  <path class="flko" d="M380,204 q60,38 120,40"/>
  <path d="M506,245 l-15,3 6,-13 z" fill="#c0392b"/>
  <text class="ko" x="404" y="266">NON — sous restriction, tireté</text>
  <rect x="512" y="212" width="160" height="112" rx="8" fill="none" stroke="#c0392b" stroke-width="2.8" stroke-dasharray="9 7"/>
  <text class="ko" x="592" y="240" text-anchor="middle">PRP ≥ 2500</text>
  <text class="lg" x="592" y="260" text-anchor="middle">exemple : R-404A</text>
  <text class="lg" x="592" y="276" text-anchor="middle">(PRP 3922)</text>
  <text class="ko" x="592" y="300" text-anchor="middle">→ en filière,</text>
  <text class="ko" x="592" y="318" text-anchor="middle">avec son papier</text>

  <!-- morale -->
  <text class="acc" x="350" y="378" text-anchor="middle">Le réflexe : AVANT de remettre, vérifier le statut — étiquette et documentation du fluide.</text>
</svg>
