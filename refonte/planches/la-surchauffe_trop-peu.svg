    </cc:License>
  </rdf:RDF>
</metadata>
  <title>Trop peu de surchauffe : du liquide peut continuer vers le compresseur</title>
  <style>
    .t  { font:700 20px "Trebuchet MS",Calibri,sans-serif; fill:#1b3a63; }
    .l  { font:700 15px Calibri,"Segoe UI",sans-serif; fill:#1b3a63; }
    .s  { font:400 14px Calibri,"Segoe UI",sans-serif; fill:#637285; }
    .r  { font:700 15px Calibri,"Segoe UI",sans-serif; fill:#c0392b; }
    .p  { fill:none; stroke:#1b3a63; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
    .rr { fill:none; stroke:#c0392b; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:7 5; }
    .fil{ fill:none; stroke:#1b3a63; stroke-width:1.2; stroke-opacity:.16; }
  </style>

  <rect width="700" height="400" fill="#fffdf8"/>
  <text class="t" x="30" y="34">Le liquide n'a pas fini de bouillir</text>

  <!-- évaporateur (en bas, à gauche) -->
  <rect x="50" y="220" width="300" height="80" rx="8" fill="#fffdf8" stroke="#1b3a63" stroke-width="2.6"/>
  <rect x="54" y="224" width="292" height="72" fill="#eaf2fb"/>
  <g fill="#fffdf8" stroke="#1b3a63" stroke-width="1.4">
    <circle cx="100" cy="270" r="6"/><circle cx="160" cy="255" r="5"/>
    <circle cx="220" cy="275" r="7"/><circle cx="280" cy="258" r="5"/>
    <circle cx="330" cy="268" r="5"/>
  </g>
  <text class="l" x="200" y="330" text-anchor="middle">Évaporateur</text>
  <text class="s" x="200" y="350" text-anchor="middle">encore du liquide jusqu'à la sortie</text>

  <!-- ligne d'aspiration vers le compresseur (à droite) -->
  <path class="p" d="M350,240 h180"/>
  <path d="M528,234 l14,6 -14,6 z" fill="#1b3a63"/>
  <!-- gouttes dans la ligne -->
  <g fill="#eaf2fb" stroke="#c0392b" stroke-width="1.6">
    <path d="M400,238 q5,-9 0,-14 q-5,5 0,14 z"/>
    <path d="M450,239 q5,-9 0,-14 q-5,5 0,14 z"/>
    <path d="M500,238 q5,-9 0,-14 q-5,5 0,14 z"/>
  </g>
  <text class="r" x="450" y="212" text-anchor="middle">des gouttes suivent la vapeur</text>

  <!-- compresseur -->
  <circle cx="590" cy="240" r="46" fill="#fffdf8" stroke="#c0392b" stroke-width="2.8" stroke-dasharray="8 5"/>
  <text class="l" x="590" y="236" text-anchor="middle">Compresseur</text>
  <text class="r" x="590" y="256" text-anchor="middle">menacé</text>

  <!-- lecture -->
  <rect x="60" y="70" width="380" height="86" rx="10" fill="#fffdf8" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="8 5"/>
  <text class="r" x="250" y="100" text-anchor="middle">Surchauffe très faible ou nulle</text>
  <text class="s" x="250" y="122" text-anchor="middle">PEUT INDIQUER un retour de liquide —</text>
  <text class="s" x="250" y="142" text-anchor="middle">on confirme avec les mesures et la documentation.</text>

  <text class="l" x="350" y="386" text-anchor="middle">Une surchauffe nulle n'est jamais un bon réglage : c'est une alarme.</text>
</svg>
