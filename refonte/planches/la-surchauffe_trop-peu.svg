<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img"
     aria-label="Évaporateur où le liquide n'a pas fini de bouillir : des gouttes continuent dans la ligne d'aspiration vers le compresseur, à droite. Une surchauffe très faible ou nulle peut indiquer un retour de liquide.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
    <cc:Work rdf:about="">
