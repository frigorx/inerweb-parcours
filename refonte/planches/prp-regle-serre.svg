<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 464" role="img"
     aria-label="La chaîne réglementaire : plus le PRP est fort, plus la règle serre. Trois étages de la même vis : le règlement F-Gas européen fait baisser les quotas de HFC mis sur le marché, année après année ; il programme l'interdiction de certains fluides à fort PRP dans de nombreux équipements neufs ; et l'amendement de Kigali applique la même logique à l'échelle mondiale. La conclusion de la frise : il n'existe pas de fluide parfait, il existe des professionnels bien formés.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
    <cc:Work rdf:about="">
      <dc:title>La chaîne réglementaire : plus le PRP est fort, plus la règle serre</dc:title>
      <dc:creator><cc:Agent><dc:title>inerWeb — F. Henninot</dc:title></cc:Agent></dc:creator>
