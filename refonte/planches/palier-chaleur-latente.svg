<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 464" role="img"
     aria-label="Zoom sur le palier de la courbe de chauffe : la chaleur latente. On continue d'apporter de l'énergie, mais la température ne bouge plus : toute l'énergie sert à changer l'état, du liquide vers la vapeur. Le thermomètre ne voit rien, et pourtant l'énergie passe — le palier n'est pas une pause, c'est un changement d'état en cours. La formule associée : Q égale m fois L, la masse fois la chaleur latente massique.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
    <cc:Work rdf:about="">
      <dc:title>Zoom sur le palier de la courbe de chauffe : la chaleur latente</dc:title>
