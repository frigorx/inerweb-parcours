<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 464" role="img"
     aria-label="Trois fois le même verre d'eau à vingt-cinq degrés, sous trois pressions extérieures différentes. Sous un virgule zéro un trois bar : la pression de vapeur de l'eau, zéro virgule zéro trente-deux bar, est bien plus petite que la pression extérieure — pas d'ébullition. Sous zéro virgule cent quatre-vingt-dix-neuf bar : toujours plus petite — pas d'ébullition. Sous zéro virgule zéro trente-deux bar : égalité — les bulles naissent dans toute la masse, l'ébullition commence. La règle : l'ébullition commence quand la pression de vapeur du liquide atteint la pression qui s'exerce sur lui.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
    <cc:Work rdf:about="">
      <dc:title>Trois fois le même verre d'eau à vingt-cinq degrés, sous trois pressions extérieures différentes</dc:title>
