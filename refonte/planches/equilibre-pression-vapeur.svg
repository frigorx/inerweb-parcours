</metadata>
  <title>L'équilibre : l'ébullition commence quand la pression de vapeur rejoint la pression extérieure</title>
  <style>
    .t   { font:700 19px Calibri,Segoe UI,sans-serif; fill:#1b3a63; }
    .st  { font:700 14px Calibri,Segoe UI,sans-serif; fill:#1b3a63; }
    .lg  { font:400 13.5px Calibri,Segoe UI,sans-serif; fill:#4a5b6e; }
    .sm  { font:400 12px Calibri,Segoe UI,sans-serif; fill:#4a5b6e; }
    .bad { font:700 13px Calibri,Segoe UI,sans-serif; fill:#c9451a; }
    .p   { fill:none; stroke:#1b3a63; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
    .acc { fill:none; stroke:#c9451a; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
    .blu { fill:none; stroke:#1b6ea8; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
    .dash{ fill:none; stroke:#8fa3b8; stroke-width:1.6; stroke-dasharray:5 5; }
  </style>

  <rect width="880" height="464" fill="#ffffff"/>
  <text class="t" x="30" y="32">Le bras de fer : pression de vapeur contre pression extérieure</text>

  <!-- ============ un gabarit répété trois fois ============ -->
  <!-- SCÈNE 1 : 1,013 bar -->
  <g transform="translate(60,0)">
    <rect x="0" y="70" width="230" height="290" rx="10" fill="#f6f9fc" stroke="#dbe4ec" stroke-width="2"/>
    <text class="st" x="115" y="100" text-anchor="middle">sous l'atmosphère</text>
    <!-- pression extérieure : flèches qui appuient -->
    <g class="blu">
      <path d="M70,130 v26 m-6,-10 6,10 6,-10"/>
      <path d="M115,124 v32 m-6,-10 6,10 6,-10"/>
      <path d="M160,130 v26 m-6,-10 6,10 6,-10"/>
    </g>
    <text class="st" x="115" y="190" text-anchor="middle" fill="#1b6ea8">1,013 bar</text>
    <!-- verre -->
    <path class="p" d="M75,330 v-80 h80 v80"/>
    <rect x="79" y="272" width="72" height="54" fill="#cfe6f5"/>
    <!-- pression de vapeur : petite poussée interne -->
    <path class="acc" d="M115,268 v-16 m-5,8 5,-8 5,8"/>
    <text class="bad" x="115" y="240" text-anchor="middle">0,032</text>
    <text class="t" x="115" y="392" text-anchor="middle" fill="#c9451a">≠</text>
    <text class="lg" x="115" y="418" text-anchor="middle">rien ne bout</text>
  </g>

  <!-- SCÈNE 2 : 0,199 bar -->
  <g transform="translate(325,0)">
    <rect x="0" y="70" width="230" height="290" rx="10" fill="#f6f9fc" stroke="#dbe4ec" stroke-width="2"/>
    <text class="st" x="115" y="100" text-anchor="middle">la pompe a bien tiré</text>
    <g class="blu">
      <path d="M90,134 v20 m-6,-9 6,9 6,-9"/>
      <path d="M140,134 v20 m-6,-9 6,9 6,-9"/>
    </g>
    <text class="st" x="115" y="190" text-anchor="middle" fill="#1b6ea8">0,199 bar</text>
    <path class="p" d="M75,330 v-80 h80 v80"/>
    <rect x="79" y="272" width="72" height="54" fill="#cfe6f5"/>
    <path class="acc" d="M115,268 v-16 m-5,8 5,-8 5,8"/>
    <text class="bad" x="115" y="240" text-anchor="middle">0,032</text>
    <text class="t" x="115" y="392" text-anchor="middle" fill="#c9451a">≠</text>
    <text class="lg" x="115" y="418" text-anchor="middle">toujours pas</text>
  </g>

  <!-- SCÈNE 3 : 0,032 bar — ÉGALITÉ -->
  <g transform="translate(590,0)">
    <rect x="0" y="70" width="230" height="290" rx="10" fill="#fdeee8" stroke="#c9451a" stroke-width="2.4"/>
    <text class="st" x="115" y="100" text-anchor="middle" fill="#a8410f">le seuil est atteint</text>
    <g class="blu">
      <path d="M115,140 v14 m-6,-8 6,8 6,-8"/>
    </g>
    <text class="st" x="115" y="190" text-anchor="middle" fill="#1b6ea8">0,032 bar</text>
    <path class="p" d="M75,330 v-80 h80 v80"/>
    <rect x="79" y="272" width="72" height="54" fill="#cfe6f5"/>
    <path class="acc" d="M115,268 v-16 m-5,8 5,-8 5,8"/>
    <text class="bad" x="115" y="240" text-anchor="middle">0,032</text>
    <!-- les bulles naissent DANS LA MASSE -->
    <g fill="#ffffff" stroke="#1b3a63" stroke-width="1.3">
      <circle cx="98" cy="320" r="4"><animate attributeName="cy" values="320;278" dur="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="118" cy="322" r="5"><animate attributeName="cy" values="322;276" dur="1s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="136" cy="318" r="3.5"><animate attributeName="cy" values="318;280" dur="1.3s" begin="0.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.3s" begin="0.7s" repeatCount="indefinite"/></circle>
    </g>
    <text class="t" x="115" y="392" text-anchor="middle" fill="#c9451a">=</text>
    <text class="bad" x="115" y="418" text-anchor="middle">ÉBULLITION — à 25 °C</text>
  </g>

  <!-- morale -->
  <path class="dash" d="M60,432 h760"/>
  <text class="st" x="440" y="456" text-anchor="middle">L'ébullition commence quand la pression de vapeur du liquide ATTEINT la pression qui s'exerce sur lui.</text>
</svg>
