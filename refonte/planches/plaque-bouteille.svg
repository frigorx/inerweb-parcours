  <title>La plaque dit tout : TW · WC · PS — la couleur, presque rien</title>
  <style>
    .t   { font:700 19px Calibri,Segoe UI,sans-serif; fill:#1b3a63; }
    .st  { font:700 14px Calibri,Segoe UI,sans-serif; fill:#1b3a63; }
    .lg  { font:400 13.5px Calibri,Segoe UI,sans-serif; fill:#4a5b6e; }
    .sm  { font:400 12px Calibri,Segoe UI,sans-serif; fill:#4a5b6e; }
    .bad { font:700 13px Calibri,Segoe UI,sans-serif; fill:#c9451a; }
    .big { font:700 24px Calibri,Segoe UI,sans-serif; fill:#1b3a63; }
    .p   { fill:none; stroke:#1b3a63; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
    .dash{ fill:none; stroke:#8fa3b8; stroke-width:1.6; stroke-dasharray:5 5; }
  </style>

  <rect width="880" height="464" fill="#ffffff"/>
  <text class="t" x="30" y="32">Tout ce qui compte est GRAVÉ — la plaque fait foi</text>

  <!-- ============ LA BOUTEILLE (petite, à gauche) ============ -->
  <g transform="translate(150,0)">
    <path class="p" d="M-46,392 v-190 a46,40 0 0 1 92,0 v190 z" fill="#f6f9fc"/>
    <path d="M-46,202 a46,40 0 0 1 92,0 z" fill="#8fa3b8"/>
    <rect x="-12" y="132" width="24" height="26" rx="4" fill="#ffffff" stroke="#1b3a63" stroke-width="2.4"/>
    <!-- la plaque sur l'ogive, mise en évidence -->
    <rect x="-30" y="216" width="60" height="40" rx="4" fill="#fff4ed" stroke="#c9451a" stroke-width="2.4"/>
    <text class="sm" x="0" y="240" text-anchor="middle">la plaque</text>
    <path class="dash" d="M34,236 h84" stroke="#c9451a"/>
    <text class="lg" x="0" y="420" text-anchor="middle">bouteille de récupération</text>
  </g>

  <!-- ============ LA PLAQUE EN GRAND ============ -->
  <rect x="270" y="70" width="540" height="252" rx="14" fill="#fff4ed" stroke="#c9451a" stroke-width="3"/>
  <circle cx="298" cy="98" r="7" fill="#ffffff" stroke="#c9451a" stroke-width="2"/>
  <circle cx="782" cy="98" r="7" fill="#ffffff" stroke="#c9451a" stroke-width="2"/>

  <g>
    <text class="big" x="300" y="140">TW</text>
    <text class="big" x="540" y="140" fill="#a8410f">6,2 kg</text>
    <text class="lg" x="620" y="140">la TARE — masse de la bouteille VIDE</text>
  </g>
  <path class="dash" d="M295,162 h490"/>
  <g>
    <text class="big" x="300" y="204">WC</text>
    <text class="big" x="540" y="204" fill="#a8410f">12 L</text>
    <text class="lg" x="620" y="196">la capacité EN EAU —</text>
    <text class="lg" x="620" y="216">le volume interne de référence</text>
  </g>
  <path class="dash" d="M295,228 h490"/>
  <g>
    <text class="big" x="300" y="272">PS</text>
    <text class="big" x="540" y="272" fill="#a8410f">45 bar</text>
    <text class="lg" x="620" y="272">la pression de SERVICE</text>
  </g>

  <!-- ============ LA COULEUR, ELLE… ============ -->
  <rect x="270" y="340" width="540" height="62" rx="10" fill="#eef3f9" stroke="#1b3a63" stroke-width="2"/>
  <text class="st" x="540" y="366" text-anchor="middle">La couleur ? Un simple repère visuel.</text>
  <text class="lg" x="540" y="390" text-anchor="middle">Sur le terrain on vérifie la conception, les marquages et la notice du récipient.</text>

  <path class="dash" d="M60,424 h760"/>
  <text class="st" x="440" y="450" text-anchor="middle">TW pour peser · WC pour la contenance · PS pour la pression : trois lettres qui commandent tous les gestes.</text>
</svg>
