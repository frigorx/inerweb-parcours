<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 464" role="img"
     aria-label="La plaque signalétique d'une bouteille, en grand : TW six virgule deux kilogrammes, la tare, c'est-à-dire la masse de la bouteille vide ; WC douze litres, la capacité en eau, le volume interne de référence ; PS quarante-cinq bars, la pression de service. Les couleurs de la bouteille servent seulement de repère visuel : sur le terrain, on vérifie la conception, les marquages et la notice du récipient. C'est la plaque qui fait foi.">
