  <title>CFC et HCFC : le chlore les a condamnés</title>
  <style>
    .t   { font:700 19px Calibri,Segoe UI,sans-serif; fill:#1b3a63; }
    .st  { font:700 14px Calibri,Segoe UI,sans-serif; fill:#1b3a63; }
    .lg  { font:400 13.5px Calibri,Segoe UI,sans-serif; fill:#4a5b6e; }
    .sm  { font:400 12px Calibri,Segoe UI,sans-serif; fill:#4a5b6e; }
    .bad { font:700 13px Calibri,Segoe UI,sans-serif; fill:#c9451a; }
    .p   { fill:none; stroke:#1b3a63; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
    .acc { fill:none; stroke:#c9451a; stroke-width:2.8; stroke-linecap:round; stroke-linejoin:round; }
    .dash{ fill:none; stroke:#8fa3b8; stroke-width:1.6; stroke-dasharray:5 5; }
    .cl  { fill:#c9451a; }
    .fl  { fill:#7db2d6; }
    .hy  { fill:#a9c8a2; }
  </style>

  <rect width="880" height="464" fill="#ffffff"/>
  <text class="t" x="30" y="32">Deux familles condamnées par le même atome : le chlore</text>

  <!-- ============ CARTE CFC ============ -->
  <rect x="60" y="64" width="360" height="330" rx="12" fill="#f6f9fc" stroke="#1b3a63" stroke-width="2.4"/>
  <text class="st" x="240" y="96" text-anchor="middle">CFC — chlore + fluor + carbone</text>
  <text class="lg" x="240" y="118" text-anchor="middle">l'exemple : R-12</text>
  <!-- molécule stylisée : C central, 2 Cl + 2 F -->
  <g transform="translate(240,210)">
    <circle r="26" fill="#4a5b6e"/><text x="0" y="6" text-anchor="middle" fill="#fff" font-weight="700" font-family="Calibri">C</text>
    <circle cx="-62" cy="-42" r="20" class="cl"/><text x="-62" y="-36" text-anchor="middle" fill="#fff" font-weight="700" font-family="Calibri">Cl</text>
    <circle cx="62" cy="-42" r="20" class="cl"/><text x="62" y="-36" text-anchor="middle" fill="#fff" font-weight="700" font-family="Calibri">Cl</text>
    <circle cx="-62" cy="46" r="20" class="fl"/><text x="-62" y="52" text-anchor="middle" fill="#fff" font-weight="700" font-family="Calibri">F</text>
    <circle cx="62" cy="46" r="20" class="fl"/><text x="62" y="52" text-anchor="middle" fill="#fff" font-weight="700" font-family="Calibri">F</text>
    <path class="p" d="M-20,-14 L-46,-32 M20,-14 L46,-32 M-20,16 L-46,34 M20,16 L46,34" stroke-width="2"/>
  </g>
  <text class="lg" x="240" y="302" text-anchor="middle">Les « miracles » des années 1930 :</text>
  <text class="lg" x="240" y="322" text-anchor="middle">stables, ni toxiques, ni inflammables…</text>
  <text class="bad" x="240" y="344" text-anchor="middle">…et tueurs d'ozone.</text>
  <!-- tampon statut CFC -->
  <g transform="translate(240,372) rotate(-6)">
    <rect x="-100" y="-22" width="200" height="44" rx="6" fill="none" stroke="#c9451a" stroke-width="3"/>
    <text class="bad" x="0" y="-2" text-anchor="middle" font-size="17">INTERDITS</text>
    <text class="bad" x="0" y="15" text-anchor="middle" font-size="12">depuis longtemps</text>
  </g>

  <!-- ============ CARTE HCFC ============ -->
  <rect x="460" y="64" width="360" height="330" rx="12" fill="#f6f9fc" stroke="#1b3a63" stroke-width="2.4"/>
  <text class="st" x="640" y="96" text-anchor="middle">HCFC — + un peu d'hydrogène</text>
  <text class="lg" x="640" y="118" text-anchor="middle">l'exemple : R-22</text>
  <!-- molécule : C central, H + Cl + 2 F -->
  <g transform="translate(640,210)">
    <circle r="26" fill="#4a5b6e"/><text x="0" y="6" text-anchor="middle" fill="#fff" font-weight="700" font-family="Calibri">C</text>
    <circle cx="-62" cy="-42" r="20" class="hy"/><text x="-62" y="-36" text-anchor="middle" fill="#fff" font-weight="700" font-family="Calibri">H</text>
    <circle cx="62" cy="-42" r="20" class="cl"/><text x="62" y="-36" text-anchor="middle" fill="#fff" font-weight="700" font-family="Calibri">Cl</text>
    <circle cx="-62" cy="46" r="20" class="fl"/><text x="-62" y="52" text-anchor="middle" fill="#fff" font-weight="700" font-family="Calibri">F</text>
    <circle cx="62" cy="46" r="20" class="fl"/><text x="62" y="52" text-anchor="middle" fill="#fff" font-weight="700" font-family="Calibri">F</text>
    <path class="p" d="M-20,-14 L-46,-32 M20,-14 L46,-32 M-20,16 L-46,34 M20,16 L46,34" stroke-width="2"/>
  </g>
  <text class="lg" x="640" y="302" text-anchor="middle">La transition : moins de chlore,</text>
  <text class="lg" x="640" y="322" text-anchor="middle">vie plus courte —</text>
  <text class="bad" x="640" y="344" text-anchor="middle">mais du chlore quand même.</text>
  <!-- tampon statut HCFC / R-22 : jamais « interdits » sec -->
  <g transform="translate(640,372) rotate(-6)">
    <rect x="-120" y="-22" width="240" height="44" rx="6" fill="none" stroke="#c9451a" stroke-width="3"/>
    <text class="bad" x="0" y="-2" text-anchor="middle" font-size="15">plus de recharge</text>
    <text class="bad" x="0" y="15" text-anchor="middle" font-size="12">récupération obligatoire</text>
  </g>

  <!-- morale -->
  <path class="dash" d="M60,418 h760"/>
  <text class="st" x="440" y="446" text-anchor="middle">Vous les croiserez encore en dépannage : savoir d'où ils viennent, c'est savoir pourquoi on ne les recharge plus.</text>
</svg>
