<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 464" role="img"
     aria-label="Deux familles condamnées par le même atome : le chlore. À gauche, les CFC comme le R-12 : les miracles des années mille neuf cent trente, stables, ni toxiques ni inflammables — et tueurs d'ozone. Interdits depuis longtemps. À droite, les HCFC comme le R-22 : la transition, un peu d'hydrogène, moins de chlore, vie plus courte — mais du chlore quand même. Statut exact du R-22 : mise sur le marché et recharge interdites, récupération obligatoire ; une machine au R-22 peut continuer de tourner sans appoint. On croise encore ces machines en dépannage : on ne les recharge plus.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
