<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img"
     aria-label="Deux bidons d'huile POE : celui qui est resté ouvert attire l'humidité de l'air ambiant ; celui qui a été refermé aussitôt reste sec. Les huiles POE sont fortement hygroscopiques.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
    <cc:Work rdf:about="">
      <dc:title>Deux bidons d'huile POE : celui qui est resté ouvert attire l'humidité de l'air ambiant ; celui qui a été refermé aussitôt reste sec</dc:title>
