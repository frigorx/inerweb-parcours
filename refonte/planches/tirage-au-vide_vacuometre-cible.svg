<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img"
     aria-label="À gauche, une horloge barrée : une durée de tirage ne prouve rien. À droite, un vacuomètre qui affiche 500 microns : la cible courante, une valeur mesurée. La notice de la pompe ou de la machine commande.">
