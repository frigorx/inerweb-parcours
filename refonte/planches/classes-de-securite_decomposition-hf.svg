<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img"
     aria-label="À gauche, une flamme chauffe un tube de circuit contenant du fluide ; des fumées montent vers un cadre rouge : produits très toxiques et corrosifs, dont le fluorure d'hydrogène, HF. L'odeur piquante n'est pas une protection : quand on la sent, l'exposition a déjà commencé. À droite, un panneau d'interdiction barré : on ne brase jamais un circuit contenant du fluide.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
    <cc:Work rdf:about="">
      <dc:title>À gauche, une flamme chauffe un tube de circuit contenant du fluide ; des fumées montent vers un cadre rouge : produits très toxiques et cor</dc:title>
