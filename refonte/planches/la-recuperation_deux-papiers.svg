</metadata>
  <title>Deux papiers, deux rôles : CERFA 15497 et BSFF (Trackdéchets)</title>
  <style>
    .t   { font:700 20px "Trebuchet MS",Calibri,Arial,sans-serif; fill:#1b3a63; }
    .st  { font:700 15px Calibri,"Segoe UI",Arial,sans-serif; fill:#1b3a63; }
    .lg  { font:400 13.5px Calibri,"Segoe UI",Arial,sans-serif; fill:#637285; }
    .acc { font:700 14px Calibri,"Segoe UI",Arial,sans-serif; fill:#c9451a; }
    .am  { font:700 15px Calibri,"Segoe UI",Arial,sans-serif; fill:#b06a00; }
    .bl  { font:700 15px Calibri,"Segoe UI",Arial,sans-serif; fill:#3d7fca; }
    .dot { fill:none; stroke:#8fa3b8; stroke-width:1.3; stroke-dasharray:2 4; }
  </style>

  <rect width="700" height="400" fill="#fffdf8"/>
  <text class="t" x="30" y="36">Deux papiers, deux rôles</text>

  <!-- CERFA 15497 -->
  <rect x="45" y="66" width="290" height="240" rx="8" fill="#ffffff" stroke="#3d7fca" stroke-width="2.8"/>
  <text class="bl" x="190" y="96" text-anchor="middle">FICHE D'INTERVENTION</text>
  <text class="st" x="190" y="118" text-anchor="middle">CERFA 15497 — trait plein</text>
  <path class="dot" d="M70,136 h240"/>
  <text class="lg" x="70" y="162">Elle trace l'INTERVENTION :</text>
  <text class="lg" x="86" y="188">• quel équipement</text>
  <text class="lg" x="86" y="210">• quel fluide</text>
  <text class="lg" x="86" y="232">• quelles quantités manipulées</text>
  <path class="dot" d="M70,252 h240"/>
  <text class="lg" x="70" y="278">Établie à chaque intervention</text>
  <text class="lg" x="70" y="296">sur le circuit.</text>

  <!-- BSFF -->
  <rect x="365" y="66" width="290" height="240" rx="8" fill="#ffffff" stroke="#b06a00" stroke-width="2.8" stroke-dasharray="9 7"/>
  <text class="am" x="510" y="96" text-anchor="middle">BSFF — trait tireté</text>
  <text class="st" x="510" y="118" text-anchor="middle">dématérialisé, sur Trackdéchets</text>
  <path class="dot" d="M390,136 h240"/>
  <text class="lg" x="390" y="162">Il suit le fluide devenu DÉCHET :</text>
  <text class="lg" x="406" y="188">• de votre bouteille…</text>
  <text class="lg" x="406" y="210">• …au repreneur ou au centre</text>
  <text class="lg" x="426" y="228">de traitement</text>
  <path class="dot" d="M390,252 h240"/>
  <text class="lg" x="390" y="278">La preuve que le fluide est bien</text>
  <text class="lg" x="390" y="296">arrivé en filière.</text>

  <!-- morale -->
  <path d="M45,330 h610" fill="none" stroke="#8fa3b8" stroke-width="1.6" stroke-dasharray="5 5"/>
  <text class="acc" x="350" y="360" text-anchor="middle">Tant que ces papiers n'existent pas, la traçabilité est incomplète —</text>
  <text class="acc" x="350" y="382" text-anchor="middle">et c'est vous qui la portez.</text>
</svg>
