<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img"
     aria-label="Deux papiers, deux rôles. À gauche, la fiche d'intervention CERFA 15497, cadre bleu à trait plein : elle trace l'intervention — équipement, fluide, quantités. À droite, le BSFF dématérialisé sur la plateforme Trackdéchets, cadre ambre à trait tireté : il suit le fluide devenu déchet jusqu'à la filière. Les deux ferment la boucle de la traçabilité.">
<metadata>
