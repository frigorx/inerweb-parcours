<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 464" role="img"
     aria-label="Deux casseroles sur deux plaques identiques, qui donnent la même énergie. La petite casserole bout déjà ; la grande, à la même température de départ, n'y est pas encore : il y a plus de matière à faire évoluer. Une même température ne signifie pas une même quantité d'énergie. Masse doublée, énergie nécessaire doublée.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
    <cc:Work rdf:about="">
      <dc:title>Deux casseroles sur deux plaques identiques, qui donnent la même énergie</dc:title>
