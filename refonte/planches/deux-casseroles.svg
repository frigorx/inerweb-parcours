    </cc:License>
  </rdf:RDF>
</metadata>
  <title>Deux casseroles, même plaque : la masse compte</title>
  <style>
    .t   { font:700 19px Calibri,Segoe UI,sans-serif; fill:#1b3a63; }
    .st  { font:700 14px Calibri,Segoe UI,sans-serif; fill:#1b3a63; }
    .lg  { font:400 13.5px Calibri,Segoe UI,sans-serif; fill:#4a5b6e; }
    .sm  { font:400 12px Calibri,Segoe UI,sans-serif; fill:#4a5b6e; }
    .bad { font:700 13px Calibri,Segoe UI,sans-serif; fill:#c9451a; }
    .p   { fill:none; stroke:#1b3a63; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
    .acc { fill:none; stroke:#c9451a; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
    .dash{ fill:none; stroke:#8fa3b8; stroke-width:1.6; stroke-dasharray:5 5; }
  </style>

  <rect width="880" height="464" fill="#ffffff"/>
  <text class="t" x="30" y="32">Même plaque, même énergie — et pourtant, deux histoires</text>

  <!-- ============ PETITE CASSEROLE ============ -->
  <g transform="translate(80,0)">
    <text class="st" x="130" y="90" text-anchor="middle">1 kg d'eau</text>
    <!-- casserole -->
    <path class="p" d="M60,240 v70 h140 v-70" fill="#ffffff"/>
    <path class="p" d="M200,252 h48"/>
    <rect x="64" y="252" width="132" height="54" fill="#cfe6f5"/>
    <!-- bulles : elle bout -->
    <g fill="#ffffff" stroke="#1b3a63" stroke-width="1.3">
      <circle cx="100" cy="300" r="4"><animate attributeName="cy" values="300;258" dur="1.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="130" cy="302" r="5"><animate attributeName="cy" values="302;256" dur="0.9s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="0.9s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="160" cy="299" r="3.5"><animate attributeName="cy" values="299;259" dur="1.2s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.6s" repeatCount="indefinite"/></circle>
    </g>
    <!-- vapeur -->
    <path class="dash" d="M110,236 q6,-14 0,-26 M140,236 q-6,-14 0,-26">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </path>
    <text class="bad" x="130" y="196" text-anchor="middle">ÇA BOUT DÉJÀ</text>
    <!-- plaque -->
    <rect x="50" y="316" width="160" height="14" rx="7" fill="#c9451a"/>
    <text class="sm" x="130" y="352" text-anchor="middle">plaque : même puissance</text>
  </g>

  <!-- ============ GRANDE CASSEROLE ============ -->
  <g transform="translate(470,0)">
    <text class="st" x="165" y="90" text-anchor="middle">3 kg d'eau — même température de départ</text>
    <path class="p" d="M40,200 v110 h250 v-110" fill="#ffffff"/>
    <path class="p" d="M290,214 h48"/>
    <rect x="44" y="214" width="242" height="92" fill="#cfe6f5"/>
    <text class="st" x="165" y="266" text-anchor="middle">pas une bulle</text>
    <!-- plaque identique -->
    <rect x="30" y="316" width="270" height="14" rx="7" fill="#c9451a"/>
    <text class="sm" x="165" y="352" text-anchor="middle">plaque : même puissance</text>
    <text class="bad" x="165" y="196" text-anchor="middle">PLUS DE MATIÈRE À FAIRE ÉVOLUER</text>
  </g>

  <!-- ============ MORALE ============ -->
  <path class="dash" d="M60,388 h760"/>
  <text class="st" x="440" y="416" text-anchor="middle">Une même température ne signifie pas une même quantité d'énergie : LA MASSE COMPTE.</text>
  <text class="lg" x="440" y="442" text-anchor="middle">Masse doublée → énergie nécessaire doublée. Masse triplée → énergie triplée, toutes choses égales par ailleurs.</text>
</svg>
