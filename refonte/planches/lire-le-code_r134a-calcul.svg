<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img"
     aria-label="R-134a : un plus un égale deux carbones ; trois moins un égale deux hydrogènes ; quatre tel quel égale quatre fluors. Sur les deux carbones accrochés, les six places sont toutes occupées par les hydrogènes et les fluors : aucune place libre, donc aucun chlore.">
  <title>R-134a : toutes les places sont prises</title>
  <style>
    .t   { font:700 20px Calibri,'Segoe UI',sans-serif; fill:#1b3a63; }
    .st  { font:700 15px Calibri,'Segoe UI',sans-serif; fill:#1b3a63; }
    .lg  { font:400 13.5px Calibri,'Segoe UI',sans-serif; fill:#637285; }
    .ok  { font:700 14.5px Calibri,'Segoe UI',sans-serif; fill:#1e7e54; }
    .calc{ font:700 17px Consolas,monospace; fill:#1b3a63; }
    .atom{ font:700 18px Calibri,'Segoe UI',sans-serif; fill:#1b3a63; }
    .p   { fill:none; stroke:#1b3a63; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
    .lien{ stroke:#1b3a63; stroke-width:2.4; }
    .cadreok{ fill:none; stroke:#1e7e54; stroke-width:2.4; }
    .dash{ fill:none; stroke:#8fa3b8; stroke-width:1.6; stroke-dasharray:5 5; }
  </style>

  <rect width="700" height="400" fill="#fffdf8"/>
  <text class="t" x="30" y="36">R-134a : 1 · 3 · 4</text>

  <!-- ===== Calcul à gauche ===== -->
  <g>
    <text class="calc" x="40" y="110">1 + 1  =  2 carbones</text>
    <text class="calc" x="40" y="160">3 − 1  =  2 hydrogènes</text>
    <text class="calc" x="40" y="210">4 tel quel = 4 fluors</text>
    <text class="lg" x="40" y="252">Deux carbones accrochés :</text>
    <text class="lg" x="40" y="274">six places autour d'eux.</text>
  </g>

  <!-- ===== Molécule à droite : CF3–CH2F ===== -->
  <g transform="translate(455,180)">
    <!-- liaison C–C -->
    <line class="lien" x1="0" y1="0" x2="110" y2="0"/>
    <!-- liaisons C gauche -->
    <line class="lien" x1="0" y1="0" x2="-58" y2="-42"/>
    <line class="lien" x1="0" y1="0" x2="-64" y2="18"/>
    <line class="lien" x1="0" y1="0" x2="-14" y2="66"/>
    <!-- liaisons C droit -->
    <line class="lien" x1="110" y1="0" x2="168" y2="-42"/>
    <line class="lien" x1="110" y1="0" x2="174" y2="18"/>
    <line class="lien" x1="110" y1="0" x2="124" y2="66"/>
    <!-- carbones -->
    <circle class="p" cx="0" cy="0" r="27" fill="#eaf2fb"/>
    <text class="atom" x="0" y="6" text-anchor="middle">C</text>
    <circle class="p" cx="110" cy="0" r="27" fill="#eaf2fb"/>
    <text class="atom" x="110" y="6" text-anchor="middle">C</text>
    <!-- côté gauche : F F F -->
    <circle class="p" cx="-72" cy="-52" r="19" fill="#fffdf8"/>
    <text class="atom" x="-72" y="-46" text-anchor="middle">F</text>
    <circle class="p" cx="-80" cy="22" r="19" fill="#fffdf8"/>
    <text class="atom" x="-80" y="28" text-anchor="middle">F</text>
    <circle class="p" cx="-18" cy="82" r="19" fill="#fffdf8"/>
    <text class="atom" x="-18" y="88" text-anchor="middle">F</text>
    <!-- côté droit : F H H -->
    <circle class="p" cx="182" cy="-52" r="19" fill="#fffdf8"/>
    <text class="atom" x="182" y="-46" text-anchor="middle">F</text>
    <circle class="p" cx="188" cy="22" r="19" fill="#fffdf8"/>
    <text class="atom" x="188" y="28" text-anchor="middle">H</text>
    <circle class="p" cx="128" cy="82" r="19" fill="#fffdf8"/>
    <text class="atom" x="128" y="88" text-anchor="middle">H</text>
  </g>

  <text class="lg" x="510" y="300" text-anchor="middle">Schéma de principe — pas à l'échelle.</text>

  <!-- ===== Conclusion ===== -->
  <rect class="cadreok" x="120" y="326" width="460" height="46" rx="8" fill="#fffdf8"/>
  <text class="ok" x="350" y="354" text-anchor="middle">Toutes les places sont prises → aucun chlore : c'est un HFC.</text>
</svg>
