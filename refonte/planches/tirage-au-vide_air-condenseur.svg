<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img"
     aria-label="Un condenseur dont une partie est occupée par de l'air incondensable : la place manque au fluide pour se liquéfier. Au manomètre, la pression de condensation peut monter anormalement — un indice, à confirmer.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
    <cc:Work rdf:about="">
      <dc:title>Un condenseur dont une partie est occupée par de l'air incondensable : la place manque au fluide pour se liquéfier</dc:title>
