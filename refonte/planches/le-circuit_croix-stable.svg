<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img"
     aria-label="Deux panneaux. À gauche, encadré en vert : le circuit dessiné en croix du frigoriste, toujours le même — détendeur à gauche, compresseur à droite, condenseur en haut, évaporateur en bas ; l'image s'imprime. À droite, encadré en rouge tireté : des formes floues marquées d'un point d'interrogation, pour un dessin qui change à chaque fois ; rien ne s'imprime.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
    <cc:Work rdf:about="">
      <dc:title>Deux panneaux</dc:title>
      <dc:creator><cc:Agent><dc:title>inerWeb — F. Henninot</dc:title></cc:Agent></dc:creator>
