<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 464" role="img"
     aria-label="Le levier du frigoriste, en deux scènes avec du R-134a. À gauche, l'évaporateur : le local est à plus quatre degrés ; en tenant le fluide à deux bars absolus, il sature à moins dix degrés, plus froid que le local — l'énergie du local entre donc dans le fluide, c'est l'effet frigorifique. À droite, le condenseur : l'extérieur est à trente degrés ; à dix virgule deux bars absolus, le fluide sature à quarante degrés, plus chaud que l'air — il lui cède son énergie. La pression ne fabrique pas le froid : elle choisit la température du changement d'état.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
