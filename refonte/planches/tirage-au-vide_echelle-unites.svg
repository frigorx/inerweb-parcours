     aria-label="Échelle du vide, de l'atmosphère vers zéro : 760 000 microns pour l'atmosphère ; 1 torr égale 1000 microns ; 1 millibar vaut environ 750 microns ; 500 microns, la cible courante, tout en bas de l'échelle.">
