<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 464" role="img"
     aria-label="Zoom sur une pente de la courbe de chauffe : la chaleur sensible. On apporte de l'énergie, la température monte, l'état ne change pas — le thermomètre la sent. La formule associée : Q égale m fois c fois delta T, la masse fois la capacité thermique fois l'écart de température. Repères de capacité thermique : eau quatre mille cent quatre-vingts, air sec mille cinq, cuivre trois cent quatre-vingt-cinq joules par kilogramme et par kelvin.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
    <cc:Work rdf:about="">
      <dc:title>Zoom sur une pente de la courbe de chauffe : la chaleur sensible</dc:title>
