<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img"
     aria-label="Trois cadres reliés par des flèches. D'abord ASHRAE 34, qui classe le fluide à partir de deux mesures : le danger à respirer et le comportement au feu. Ensuite l'étiquette qui en résulte : A1, A2L, A2, A3, B1, B2L, B2, B3. Enfin NF EN 378, qui encadre l'application et en tire les règles d'installation. En dessous : le classement peut évoluer, la classe 2L s'est ajoutée aux trois autres.">
