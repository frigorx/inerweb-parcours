<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img"
     aria-label="Deux cartes reliées par une double flèche : le code R-134a d'un côté, la molécule deux carbones, deux hydrogènes, quatre fluors de l'autre. La flèche porte la mention : convention d'écriture, norme ASHRAE 34. En dessous, l'analogie : comme un indicatif téléphonique, la France c'est 33 — rien à comprendre, tout à apprendre.">
  <title>Le décalage est une convention, pas une loi de la nature</title>
  <style>
    .t   { font:700 20px Calibri,'Segoe UI',sans-serif; fill:#1b3a63; }
    .st  { font:700 15px Calibri,'Segoe UI',sans-serif; fill:#1b3a63; }
    .lg  { font:400 13.5px Calibri,'Segoe UI',sans-serif; fill:#637285; }
    .acc { font:700 14px Calibri,'Segoe UI',sans-serif; fill:#c9451a; }
    .code{ font:700 24px Consolas,monospace; fill:#1b3a63; }
    .p   { fill:none; stroke:#1b3a63; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
    .fl  { fill:none; stroke:#3d7fca; stroke-width:2.6; stroke-linecap:round; marker-end:url(#fd); marker-start:url(#fg); }
    .dash{ fill:none; stroke:#8fa3b8; stroke-width:1.6; stroke-dasharray:5 5; }
  </style>
  <defs>
    <marker id="fd" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#3d7fca"/>
    </marker>
    <marker id="fg" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto">
      <path d="M8,0 L0,4.5 L8,9 z" fill="#3d7fca"/>
    </marker>
  </defs>

  <rect width="700" height="400" fill="#fffdf8"/>
  <text class="t" x="30" y="36">Une convention d'écriture — rien de plus</text>

  <!-- ===== Carte code ===== -->
  <rect class="p" x="50" y="90" width="220" height="120" rx="10" fill="#fffdf8"/>
  <text class="code" x="160" y="146" text-anchor="middle">R-134a</text>
  <text class="lg" x="160" y="184" text-anchor="middle">le code</text>

  <!-- ===== Double flèche ===== -->
  <path class="fl" d="M290,150 h120"/>
  <text class="acc" x="350" y="120" text-anchor="middle">convention d'écriture</text>
  <text class="acc" x="350" y="138" text-anchor="middle">norme ASHRAE 34</text>

  <!-- ===== Carte molécule ===== -->
  <rect class="p" x="430" y="90" width="220" height="120" rx="10" fill="#eaf2fb"/>
  <text class="st" x="540" y="140" text-anchor="middle">2 C · 2 H · 4 F</text>
  <text class="lg" x="540" y="184" text-anchor="middle">la molécule</text>

  <!-- ===== Analogie ===== -->
  <path class="dash" d="M40,250 h620"/>
  <text class="st" x="350" y="292" text-anchor="middle">Comme un indicatif téléphonique : la France, c'est le 33.</text>
  <text class="lg" x="350" y="322" text-anchor="middle">Personne ne demande pourquoi. Il n'y a aucune raison chimique à chercher au décalage :</text>
  <text class="lg" x="350" y="344" text-anchor="middle">c'est un choix d'écriture fait par la norme.</text>
  <text class="acc" x="350" y="378" text-anchor="middle">Ne cherchez pas à le comprendre : apprenez-le.</text>
</svg>
