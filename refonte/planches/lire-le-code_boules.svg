<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img"
     aria-label="Quatre sortes de boules : C le carbone, H l'hydrogène, F le fluor, Cl le chlore. Une boule seule est un atome ; plusieurs boules accrochées entre elles forment une molécule. Schéma de principe, pas à l'échelle.">
  <title>Quatre boules suffisent : atome et molécule</title>
  <style>
    .t   { font:700 20px Calibri,'Segoe UI',sans-serif; fill:#1b3a63; }
    .st  { font:700 15px Calibri,'Segoe UI',sans-serif; fill:#1b3a63; }
    .lg  { font:400 13.5px Calibri,'Segoe UI',sans-serif; fill:#637285; }
    .atom{ font:700 18px Calibri,'Segoe UI',sans-serif; fill:#1b3a63; }
    .p   { fill:none; stroke:#1b3a63; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
    .lien{ stroke:#1b3a63; stroke-width:2.4; }
    .dash{ fill:none; stroke:#8fa3b8; stroke-width:1.6; stroke-dasharray:5 5; }
  </style>

  <rect width="700" height="400" fill="#fffdf8"/>
  <text class="t" x="30" y="36">Quatre sortes de boules suffisent</text>

  <!-- ===== Les quatre boules ===== -->
  <g>
    <circle class="p" cx="90" cy="110" r="30" fill="#eaf2fb"/>
    <text class="atom" x="90" y="117" text-anchor="middle">C</text>
    <text class="lg" x="90" y="164" text-anchor="middle">le carbone</text>

    <circle class="p" cx="240" cy="110" r="22" fill="#fffdf8"/>
    <text class="atom" x="240" y="117" text-anchor="middle">H</text>
    <text class="lg" x="240" y="164" text-anchor="middle">l'hydrogène</text>

    <circle class="p" cx="390" cy="110" r="22" fill="#fffdf8"/>
    <text class="atom" x="390" y="117" text-anchor="middle">F</text>
    <text class="lg" x="390" y="164" text-anchor="middle">le fluor</text>

    <circle class="p" cx="540" cy="110" r="24" fill="#fffdf8"/>
    <text class="atom" x="540" y="117" text-anchor="middle">Cl</text>
    <text class="lg" x="540" y="164" text-anchor="middle">le chlore</text>
  </g>

  <path class="dash" d="M40,192 h620"/>

  <!-- ===== Atome seul ===== -->
  <g>
    <circle class="p" cx="150" cy="272" r="22" fill="#fffdf8"/>
    <text class="atom" x="150" y="279" text-anchor="middle">F</text>
    <text class="st" x="150" y="330" text-anchor="middle">une boule seule :</text>
    <text class="st" x="150" y="352" text-anchor="middle">un atome</text>
  </g>

  <!-- ===== Molécule ===== -->
  <g transform="translate(470,272)">
    <line class="lien" x1="0" y1="0" x2="-58" y2="-24"/>
    <line class="lien" x1="0" y1="0" x2="58" y2="-24"/>
    <line class="lien" x1="0" y1="0" x2="-58" y2="24"/>
    <line class="lien" x1="0" y1="0" x2="58" y2="24"/>
    <circle class="p" cx="0" cy="0" r="26" fill="#eaf2fb"/>
    <text class="atom" x="0" y="7" text-anchor="middle">C</text>
    <circle class="p" cx="-70" cy="-30" r="18" fill="#fffdf8"/>
    <text class="atom" x="-70" y="-24" text-anchor="middle">H</text>
    <circle class="p" cx="70" cy="-30" r="18" fill="#fffdf8"/>
    <text class="atom" x="70" y="-24" text-anchor="middle">H</text>
    <circle class="p" cx="-70" cy="30" r="18" fill="#fffdf8"/>
    <text class="atom" x="-70" y="36" text-anchor="middle">F</text>
    <circle class="p" cx="70" cy="30" r="18" fill="#fffdf8"/>
    <text class="atom" x="70" y="36" text-anchor="middle">F</text>
    <text class="st" x="0" y="82" text-anchor="middle">des boules accrochées : une molécule</text>
  </g>

  <text class="lg" x="660" y="390" text-anchor="end">Schéma de principe — pas à l'échelle.</text>
</svg>
