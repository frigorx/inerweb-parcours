<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img"
     aria-label="Évaporateur où l'ébullition finit très tôt : toute la fin de l'échangeur ne contient plus que de la vapeur et ne produit presque plus de froid. La vapeur arrive plus chaude au compresseur, à droite.">
