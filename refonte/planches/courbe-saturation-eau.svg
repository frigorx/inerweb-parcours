<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 464" role="img"
     aria-label="La courbe de saturation de l'eau : la pression absolue en hauteur, la température d'ébullition en largeur. Quatre points la jalonnent : un virgule zéro un trois bar donne cent degrés, zéro virgule quatre cent soixante-quatorze bar donne quatre-vingts degrés, zéro virgule cent quatre-vingt-dix-neuf bar donne soixante degrés, et zéro virgule zéro trente-deux bar donne vingt-cinq degrés. La courbe n'est pas une droite, mais elle monte toujours : baisser la pression abaisse la température d'ébullition. Au-dessus de la courbe, l'eau reste liquide ; en dessous, elle est vapeur.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
    <cc:Work rdf:about="">
      <dc:title>La courbe de saturation de l'eau : la pression absolue en hauteur, la température d'ébullition en largeur</dc:title>
