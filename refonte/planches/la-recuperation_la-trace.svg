<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img"
     aria-label="La trace écrite de la récupération : une fiche où l'on note le fluide, la masse, la machine d'origine, la bouteille de destination, l'intervenant et la date. Cette écriture permet de suivre la matière du circuit jusqu'à sa destination finale.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
    <cc:Work rdf:about="">
