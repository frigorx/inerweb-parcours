    </cc:License>
  </rdf:RDF>
</metadata>
  <title>La trace : quoi, combien, d'où, vers où — par qui, quel jour</title>
  <style>
    .t   { font:700 20px "Trebuchet MS",Calibri,Arial,sans-serif; fill:#1b3a63; }
    .st  { font:700 15px Calibri,"Segoe UI",Arial,sans-serif; fill:#1b3a63; }
    .lg  { font:400 13.5px Calibri,"Segoe UI",Arial,sans-serif; fill:#637285; }
    .acc { font:700 14px Calibri,"Segoe UI",Arial,sans-serif; fill:#c9451a; }
    .li  { font:400 15px Calibri,"Segoe UI",Arial,sans-serif; fill:#10233c; }
    .dot { fill:none; stroke:#8fa3b8; stroke-width:1.4; stroke-dasharray:2 4; }
  </style>

  <rect width="700" height="400" fill="#fffdf8"/>
  <text class="t" x="30" y="36">On écrit — pour suivre la matière</text>

  <!-- la fiche -->
  <rect x="60" y="58" width="360" height="290" rx="8" fill="#ffffff" stroke="#1b3a63" stroke-width="2.6"/>
  <rect x="60" y="58" width="360" height="42" rx="8" fill="none" stroke="#1b3a63" stroke-width="2.6"/>
  <text class="st" x="240" y="86" text-anchor="middle">FICHE — RÉCUPÉRATION DE FLUIDE</text>

  <text class="li" x="84" y="132"><tspan font-weight="700">Quel fluide</tspan> (désignation)</text>
  <path class="dot" d="M300,132 h96"/>
  <text class="li" x="84" y="168"><tspan font-weight="700">Quelle masse</tspan> (pesée)</text>
  <path class="dot" d="M300,168 h96"/>
  <text class="li" x="84" y="204"><tspan font-weight="700">De quelle machine</tspan> (équipement)</text>
  <path class="dot" d="M330,204 h66"/>
  <text class="li" x="84" y="240"><tspan font-weight="700">Vers quelle bouteille</tspan> (n°)</text>
  <path class="dot" d="M300,240 h96"/>
  <text class="li" x="84" y="276"><tspan font-weight="700">Par qui</tspan> (intervenant)</text>
  <path class="dot" d="M300,276 h96"/>
  <text class="li" x="84" y="312"><tspan font-weight="700">Quel jour</tspan> (date)</text>
  <path class="dot" d="M300,312 h96"/>

  <!-- ce que ça permet -->
  <text class="st" x="460" y="120">Pourquoi écrire ?</text>
  <text class="lg" x="460" y="146">Pour suivre la matière :</text>
  <text class="lg" x="460" y="164">du circuit d'origine…</text>
  <path d="M470,176 v26" fill="none" stroke="#3d7fca" stroke-width="3" stroke-linecap="round"/>
  <path d="M470,208 l-7,-12 h14 z" fill="#3d7fca"/>
  <text class="lg" x="460" y="230">…à la bouteille…</text>
  <path d="M470,242 v26" fill="none" stroke="#3d7fca" stroke-width="3" stroke-linecap="round"/>
  <path d="M470,274 l-7,-12 h14 z" fill="#3d7fca"/>
  <text class="lg" x="460" y="296">…jusqu'à la destination</text>
  <text class="lg" x="460" y="314">finale.</text>

  <!-- morale -->
  <text class="acc" x="350" y="382" text-anchor="middle">Sans étiquette et sans écrit, la bouteille devient le problème du suivant.</text>
</svg>
