<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img"
     aria-label="Une salle des machines : un détecteur fixe est monté au mur, il surveille en permanence et déclenche une alarme qui prévient l'exploitant. Il devient obligatoire à partir de 500 tonnes équivalent CO₂ (annexe I) ou 100 kilogrammes (annexe II concernée). Lui-même se vérifie au moins tous les 12 mois. En contrepartie, l'intervalle entre deux contrôles humains est doublé.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
    <cc:Work rdf:about="">
