<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img"
     aria-label="Une bouteille marquée R-404A contient trois fluides mélangés : R-125, R-143a et R-134a. Leur composition est attribuée par la norme — elle ne se déduit pas du code. Le numéro 404 est un numéro d'ordre ; la majuscule finale désigne la version du mélange.">
