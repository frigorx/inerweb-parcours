</metadata>
  <title>R-404A : trois fluides dans la même bouteille</title>
  <style>
    .t   { font:700 20px Calibri,'Segoe UI',sans-serif; fill:#1b3a63; }
    .st  { font:700 15px Calibri,'Segoe UI',sans-serif; fill:#1b3a63; }
    .lg  { font:400 13.5px Calibri,'Segoe UI',sans-serif; fill:#637285; }
    .acc { font:700 14.5px Calibri,'Segoe UI',sans-serif; fill:#c9451a; }
    .code{ font:700 19px Consolas,monospace; fill:#1b3a63; }
    .comp{ font:700 16px Consolas,monospace; fill:#1b3a63; }
    .p   { fill:none; stroke:#1b3a63; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
    .fl  { fill:none; stroke:#3d7fca; stroke-width:2.2; stroke-linecap:round; marker-end:url(#fleche); }
    .dash{ fill:none; stroke:#8fa3b8; stroke-width:1.6; stroke-dasharray:5 5; }
  </style>
  <defs>
    <marker id="fleche" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#3d7fca"/>
    </marker>
  </defs>

  <rect width="700" height="400" fill="#fffdf8"/>
  <text class="t" x="30" y="36">Dans la bouteille : pas une molécule, trois fluides</text>

  <!-- ===== Bouteille ===== -->
  <g transform="translate(130,0)">
    <!-- robinet -->
    <rect class="p" x="-12" y="74" width="24" height="18" fill="#fffdf8"/>
    <path class="p" d="M-26,74 h52"/>
    <!-- col + corps -->
    <path class="p" d="M-22,120 q0,-22 22,-28 q22,6 22,28 v170 q0,14 -14,14 h-16 q-14,0 -14,-14 z" fill="#eaf2fb"/>
    <!-- étiquette -->
    <rect class="p" x="-36" y="170" width="72" height="44" rx="6" fill="#fffdf8"/>
    <text class="code" x="0" y="198" text-anchor="middle">R-404A</text>
  </g>

  <!-- ===== Les trois composants ===== -->
  <g>
    <path class="fl" d="M330,150 h-140"/>
    <path class="fl" d="M330,205 h-140"/>
    <path class="fl" d="M330,260 h-140"/>
    <rect class="p" x="345" y="128" width="130" height="40" rx="8" fill="#fffdf8"/>
    <text class="comp" x="410" y="153" text-anchor="middle">R-125</text>
    <rect class="p" x="345" y="183" width="130" height="40" rx="8" fill="#fffdf8"/>
    <text class="comp" x="410" y="208" text-anchor="middle">R-143a</text>
    <rect class="p" x="345" y="238" width="130" height="40" rx="8" fill="#fffdf8"/>
    <text class="comp" x="410" y="263" text-anchor="middle">R-134a</text>
    <text class="st" x="545" y="188">trois fluides,</text>
    <text class="st" x="545" y="212">mélangés</text>
  </g>

  <!-- ===== Notes ===== -->
  <path class="dash" d="M40,320 h620"/>
  <text class="acc" x="350" y="350" text-anchor="middle">Composition attribuée par la norme — elle ne se déduit pas du code.</text>
  <text class="lg" x="350" y="378" text-anchor="middle">404 = un numéro d'ordre · la majuscule finale (A) = la version : mêmes composants, proportions différentes.</text>
</svg>
