<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img"
     aria-label="Trois marches montantes. Première marche : dès 5 tonnes équivalent CO₂ (annexe I) ou 1 kilogramme (annexe II section 1), contrôle tous les 12 mois. Deuxième marche : dès 50 tonnes ou 10 kilogrammes, tous les 6 mois. Troisième marche : dès 500 tonnes ou 100 kilogrammes, tous les 3 mois. Un système de détection de fuite installé et vérifié double l'intervalle. Les équipements hermétiquement scellés ont leurs seuils propres. Source : règlement (UE) 2024/573, article 5.">
