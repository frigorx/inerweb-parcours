  <title>Les seuils du contrôle périodique — article 5 du règlement (UE) 2024/573</title>
  <style>
    .t   { font:700 19px "Trebuchet MS",Calibri,Arial,sans-serif; fill:#1b3a63; }
    .st  { font:700 15px Calibri,"Segoe UI",Arial,sans-serif; fill:#1b3a63; }
    .lg  { font:400 13.5px Calibri,"Segoe UI",Arial,sans-serif; fill:#637285; }
    .sm  { font:400 12.5px Calibri,"Segoe UI",Arial,sans-serif; fill:#637285; }
    .acc { font:700 14px Calibri,"Segoe UI",Arial,sans-serif; fill:#c9451a; }
    .big { font:700 20px Calibri,"Segoe UI",Arial,sans-serif; fill:#1b3a63; }
    .ok  { font:700 13px Calibri,"Segoe UI",Arial,sans-serif; fill:#1e7e54; }
    .p   { fill:none; stroke:#1b3a63; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
    .dash{ fill:none; stroke:#8fa3b8; stroke-width:1.5; stroke-dasharray:5 5; }
  </style>

  <rect width="700" height="400" fill="#ffffff"/>
  <text class="t" x="24" y="30">Plus le dégât possible est grand, plus on regarde souvent</text>

  <!-- ===== Les trois marches ===== -->
  <!-- marche 1 -->
  <rect x="40" y="196" width="196" height="94" rx="8" fill="#fffdf8" stroke="#1b3a63" stroke-width="2.4"/>
  <text class="big" x="138" y="230" text-anchor="middle">tous les 12 mois</text>
  <text class="sm" x="138" y="252" text-anchor="middle">dès 5 t éq. CO₂ (annexe I)</text>
  <text class="sm" x="138" y="270" text-anchor="middle">dès 1 kg (annexe II · s. 1)</text>

  <!-- marche 2 -->
  <rect x="252" y="152" width="196" height="138" rx="8" fill="#fffdf8" stroke="#1b3a63" stroke-width="2.4"/>
  <text class="big" x="350" y="188" text-anchor="middle">tous les 6 mois</text>
  <text class="sm" x="350" y="210" text-anchor="middle">dès 50 t éq. CO₂ (annexe I)</text>
  <text class="sm" x="350" y="228" text-anchor="middle">dès 10 kg (annexe II · s. 1)</text>

  <!-- marche 3 -->
  <rect x="464" y="108" width="196" height="182" rx="8" fill="#fffdf8" stroke="#1b3a63" stroke-width="2.4"/>
  <text class="big" x="562" y="144" text-anchor="middle">tous les 3 mois</text>
  <text class="sm" x="562" y="166" text-anchor="middle">dès 500 t éq. CO₂ (annexe I)</text>
  <text class="sm" x="562" y="184" text-anchor="middle">dès 100 kg (annexe II · s. 1)</text>

  <!-- flèche de montée -->
  <path class="p" d="M60,96 q290,-52 596,-14 m-14,-10 14,10 -16,7" stroke="#c9451a"/>
  <text class="acc" x="330" y="66" text-anchor="middle">le dégât possible monte →</text>

  <!-- sous le premier seuil -->
  <text class="sm" x="40" y="312">Sous le premier seuil : pas de contrôle périodique obligatoire.</text>

  <!-- ===== Les deux règles annexes ===== -->
  <path class="dash" d="M24,330 h652"/>
  <text class="ok" x="40" y="356">✓ Détection de fuite installée et vérifiée : l'intervalle est DOUBLÉ.</text>
  <text class="lg" x="40" y="378">Équipements hermétiquement scellés : seuils propres. — Source : règlement (UE) 2024/573, article 5.</text>
</svg>
