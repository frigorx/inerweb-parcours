<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 464" role="img"
     aria-label="Deux logiques face à face. La mauvaise : compter sur la soupape — se fier à elle, c'est accepter d'avoir déjà créé une situation dangereuse, car la soupape ou le disque de rupture ne transforme jamais un surremplissage en bonne pratique. La bonne : empêcher le surremplissage par la pesée — masse brute moins tare, et le respect du remplissage autorisé. La sécurité commence avant d'ouvrir les vannes : identifier, peser, surveiller.">
  <title>La soupape est un dernier recours — jamais une autorisation</title>
  <style>
    .t   { font:700 19px Calibri,Segoe UI,sans-serif; fill:#1b3a63; }
    .st  { font:700 14px Calibri,Segoe UI,sans-serif; fill:#1b3a63; }
    .lg  { font:400 13.5px Calibri,Segoe UI,sans-serif; fill:#4a5b6e; }
    .sm  { font:400 12px Calibri,Segoe UI,sans-serif; fill:#4a5b6e; }
    .bad { font:700 13px Calibri,Segoe UI,sans-serif; fill:#c9451a; }
    .ok  { font:700 14px Calibri,Segoe UI,sans-serif; fill:#2e7d4f; }
    .p   { fill:none; stroke:#1b3a63; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
    .dash{ fill:none; stroke:#8fa3b8; stroke-width:1.6; stroke-dasharray:5 5; }
  </style>

  <rect width="880" height="464" fill="#ffffff"/>
  <text class="t" x="30" y="32">Deux logiques — une seule est le métier</text>

  <!-- ============ LA MAUVAISE ============ -->
  <rect x="60" y="64" width="360" height="330" rx="12" fill="#fdeee8" stroke="#c9451a" stroke-width="2.6"/>
  <text class="bad" x="240" y="96" text-anchor="middle" font-size="15">« LA SOUPAPE ME PROTÈGE »</text>
  <!-- bouteille gavée qui crache par la soupape -->
  <g transform="translate(175,0)">
    <rect x="0" y="160" width="110" height="180" rx="16" fill="#ffffff" stroke="#c9451a" stroke-width="2.6"/>
    <rect x="4" y="172" width="102" height="164" rx="12" fill="#cfe6f5"/>
    <text class="sm" x="55" y="260" text-anchor="middle">rempli à ras</text>
    <rect x="38" y="132" width="22" height="28" rx="4" fill="#1b3a63"/>
    <!-- soupape latérale qui crache -->
    <rect x="70" y="138" width="18" height="14" rx="3" fill="#c9451a"/>
    <g stroke="#c9451a" stroke-width="2.4" fill="none">
      <path d="M92,145 h26 m-8,-6 8,6 -8,6"><animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/></path>
      <path d="M92,133 q18,-8 30,-4"><animate attributeName="opacity" values="0.2;1;0.2" dur="0.8s" repeatCount="indefinite"/></path>
    </g>
  </g>
  <text class="lg" x="240" y="368" text-anchor="middle">s'y fier, c'est avoir DÉJÀ créé</text>
  <text class="bad" x="240" y="388" text-anchor="middle">une situation dangereuse</text>

  <!-- ============ LA BONNE ============ -->
  <rect x="460" y="64" width="360" height="330" rx="12" fill="#eef7f0" stroke="#2e7d4f" stroke-width="2.6"/>
  <text class="ok" x="640" y="96" text-anchor="middle" font-size="15">« JE PÈSE — DONC JE N'Y ARRIVE JAMAIS »</text>
  <!-- bouteille sur balance -->
  <g transform="translate(575,0)">
    <rect x="0" y="150" width="110" height="170" rx="16" fill="#ffffff" stroke="#2e7d4f" stroke-width="2.6"/>
    <rect x="4" y="210" width="102" height="106" rx="12" fill="#cfe6f5"/>
    <text class="sm" x="55" y="200" text-anchor="middle">marge gardée</text>
    <rect x="38" y="122" width="22" height="28" rx="4" fill="#1b3a63"/>
    <!-- balance -->
    <rect x="-15" y="322" width="140" height="20" rx="6" fill="#2e7d4f"/>
    <rect x="15" y="346" width="80" height="24" rx="5" fill="#ffffff" stroke="#2e7d4f" stroke-width="2.2"/>
    <text class="st" x="55" y="363" text-anchor="middle" fill="#2e7d4f">13,4 kg</text>
  </g>
  <text class="lg" x="640" y="398" text-anchor="middle" opacity="0"> </text>
  <text class="ok" x="640" y="388" text-anchor="middle">brut − tare : la prévention, c'est la pesée</text>

  <!-- morale -->
  <path class="dash" d="M60,414 h760"/>
  <text class="st" x="440" y="440" text-anchor="middle">La soupape ne transforme JAMAIS un surremplissage en bonne pratique.</text>
  <text class="lg" x="440" y="460" text-anchor="middle">La sécurité commence avant d'ouvrir les vannes : identifier · peser · surveiller.</text>
</svg>
