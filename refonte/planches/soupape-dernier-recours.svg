<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 464" role="img"
     aria-label="Deux chemins vers la sécurité, et un seul est le bon. Le bon chemin, en premier : empêcher le surremplissage par la pesée — la balance avant, pendant et après. Le mauvais réflexe : compter sur la soupape ou le disque de rupture. Cette protection mécanique est un dernier recours : s'y fier, c'est accepter d'avoir déjà créé une situation dangereuse. La soupape ne transforme jamais un surremplissage en bonne pratique.">
  <title>La soupape est un dernier recours — jamais une autorisation</title>
  <style>
    .t   { font:700 19px Calibri,Segoe UI,sans-serif; fill:#1b3a63; }
    .st  { font:700 14px Calibri,Segoe UI,sans-serif; fill:#1b3a63; }
    .lg  { font:400 13.5px Calibri,Segoe UI,sans-serif; fill:#4a5b6e; }
    .sm  { font:400 12px Calibri,Segoe UI,sans-serif; fill:#4a5b6e; }
    .bad { font:700 13px Calibri,Segoe UI,sans-serif; fill:#c9451a; }
    .ok  { font:700 14px Calibri,Segoe UI,sans-serif; fill:#2e7d4f; }
    .p   { fill:none; stroke:#1b3a63; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
    .dash{ fill:none; stroke:#8fa3b8; stroke-width:1.6; stroke-dasharray:5 5; }
  </style>

  <rect width="880" height="464" fill="#ffffff"/>
  <text class="t" x="30" y="32">Deux chemins vers la sécurité — un seul est le bon</text>

  <!-- ============ LE BON CHEMIN : LA PESÉE ============ -->
  <rect x="60" y="66" width="360" height="320" rx="12" fill="#eef7f0" stroke="#2e7d4f" stroke-width="2.6"/>
  <text class="ok" x="240" y="98" text-anchor="middle" font-size="16">✓ LA PRÉVENTION : la pesée</text>
  <!-- balance avec bouteille -->
  <g transform="translate(240,0)">
    <path class="p" d="M-26,300 v-96 a26,22 0 0 1 52,0 v96 z" fill="#f6f9fc"/>
    <path d="M-26,204 a26,22 0 0 1 52,0 z" fill="#7db2d6"/>
    <rect x="-7" y="166" width="14" height="16" rx="3" fill="#ffffff" stroke="#1b3a63" stroke-width="2"/>
    <!-- plateau -->
    <rect x="-70" y="302" width="140" height="14" rx="7" fill="#2e7d4f"/>
    <rect x="-46" y="318" width="92" height="30" rx="6" fill="#ffffff" stroke="#2e7d4f" stroke-width="2.2"/>
    <text class="ok" x="0" y="339" text-anchor="middle">13,4 kg</text>
  </g>
  <text class="lg" x="240" y="146" text-anchor="middle">on pèse AVANT, PENDANT, APRÈS —</text>
  <text class="lg" x="240" y="166" text-anchor="middle">le surremplissage n'arrive jamais</text>
  <text class="ok" x="240" y="374" text-anchor="middle">la marge de dilatation reste intacte</text>

  <!-- ============ LE MAUVAIS RÉFLEXE : LA SOUPAPE ============ -->
  <rect x="460" y="66" width="360" height="320" rx="12" fill="#fdeee8" stroke="#c9451a" stroke-width="2.6"/>
  <text class="bad" x="640" y="98" text-anchor="middle" font-size="16">✗ LE DERNIER RECOURS : la soupape</text>
  <!-- bouteille pleine à ras avec soupape qui crache -->
  <g transform="translate(640,0)">
    <path class="p" d="M-26,300 v-96 a26,22 0 0 1 52,0 v96 z" fill="#fdeee8" stroke="#c9451a"/>
    <rect x="-22" y="192" width="44" height="104" fill="#cfe6f5"/>
    <text class="sm" x="0" y="252" text-anchor="middle">à ras</text>
    <rect x="-7" y="166" width="14" height="16" rx="3" fill="#ffffff" stroke="#c9451a" stroke-width="2"/>
    <!-- jet de la soupape -->
    <g class="p" stroke="#c9451a">
      <path d="M14,170 q22,-10 40,-6"><animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/></path>
      <path d="M14,176 q24,-2 42,4"><animate attributeName="opacity" values="0.2;1;0.2" dur="0.8s" repeatCount="indefinite"/></path>
    </g>
    <text class="bad" x="66" y="150">elle crache…</text>
    <text class="sm" x="66" y="168">donc le danger</text>
    <text class="sm" x="66" y="184">EXISTE déjà</text>
  </g>
  <text class="lg" x="640" y="330" text-anchor="middle">s'y fier, c'est accepter d'avoir déjà</text>
  <text class="lg" x="640" y="350" text-anchor="middle">créé une situation dangereuse</text>
  <text class="bad" x="640" y="374" text-anchor="middle">jamais une autorisation de surremplir</text>

  <!-- morale -->
  <path class="dash" d="M60,410 h760"/>
  <text class="st" x="440" y="436" text-anchor="middle">La bonne sécurité, c'est d'EMPÊCHER le surremplissage — et on l'empêche par la pesée.</text>
  <text class="lg" x="440" y="458" text-anchor="middle">La sécurité commence avant d'ouvrir les vannes.</text>
</svg>
