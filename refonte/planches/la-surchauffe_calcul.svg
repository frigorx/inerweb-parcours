<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img"
     aria-label="Deux valeurs : la température du tube, mesurée à la sonde de contact, et la température de saturation, lue dans la table à partir de la pression. Leur différence est la surchauffe, en kelvins.">
