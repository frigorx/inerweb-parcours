  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
    <cc:Work rdf:about="">
      <dc:title>Deux valeurs : la température du tube, mesurée à la sonde de contact, et la température de saturation, lue dans la table à partir de la pres</dc:title>
