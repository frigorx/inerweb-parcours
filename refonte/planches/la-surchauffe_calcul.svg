</metadata>
  <title>Le calcul de la surchauffe : une mesurée, une lue, une soustraction</title>
  <style>
    .t  { font:700 20px "Trebuchet MS",Calibri,sans-serif; fill:#1b3a63; }
    .l  { font:700 15px Calibri,"Segoe UI",sans-serif; fill:#1b3a63; }
    .s  { font:400 14px Calibri,"Segoe UI",sans-serif; fill:#637285; }
    .f  { font:700 17px Calibri,"Segoe UI",sans-serif; fill:#1b3a63; }
    .a  { font:700 14px Calibri,"Segoe UI",sans-serif; fill:#c9451a; }
    .p  { fill:none; stroke:#1b3a63; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
    .o  { fill:none; stroke:#c9451a; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:7 5; }
    .fil{ fill:none; stroke:#1b3a63; stroke-width:1.2; stroke-opacity:.16; }
  </style>

  <rect width="700" height="400" fill="#fffdf8"/>
  <text class="t" x="30" y="34">Deux valeurs, deux origines différentes</text>

  <!-- ① MESURÉE : sonde -->
  <g>
    <rect x="45" y="70" width="280" height="180" rx="10" fill="#fffdf8" stroke="#1b3a63" stroke-width="2.6"/>
    <text class="l" x="185" y="98" text-anchor="middle">① MESURÉE — trait plein</text>
    <!-- tube + sonde -->
    <path class="p" d="M75,170 h220"/>
    <rect x="165" y="158" width="40" height="24" rx="5" fill="#eaf2fb" stroke="#1b3a63" stroke-width="2"/>
    <path class="p" d="M185,158 v-28"/>
    <rect x="160" y="106" width="50" height="26" rx="5" fill="#fffdf8" stroke="#1b3a63" stroke-width="2"/>
    <text class="l" x="185" y="212" text-anchor="middle">sonde de contact</text>
    <text class="s" x="185" y="234" text-anchor="middle">température du tube, en °C</text>
  </g>

  <!-- ② LUE : manomètre + table -->
  <g>
    <rect x="375" y="70" width="280" height="180" rx="10" fill="#fffdf8" stroke="#c9451a" stroke-width="2.6" stroke-dasharray="8 5"/>
    <text class="a" x="515" y="98" text-anchor="middle">② LUE — trait tireté</text>
    <!-- manomètre -->
    <circle cx="440" cy="160" r="30" fill="#fffdf8" stroke="#1b3a63" stroke-width="2.4"/>
    <path class="p" d="M440,160 l17,-16"/>
    <text class="s" x="440" y="212" text-anchor="middle">pression, en bar</text>
    <!-- flèche vers table -->
    <path class="o" d="M478,160 h44"/>
    <path d="M520,154 l12,6 -12,6 z" fill="#c9451a"/>
    <!-- table -->
    <rect x="535" y="126" width="96" height="70" rx="5" fill="#fffdf8" stroke="#1b3a63" stroke-width="2"/>
    <rect x="535" y="126" width="96" height="20" rx="5" fill="#1b3a63"/>
    <path class="fil" d="M583,146 v50 M535,162 h96 M535,178 h96"/>
    <text class="s" x="583" y="212" text-anchor="middle">table du fluide</text>
    <text class="s" x="515" y="234" text-anchor="middle">température de saturation, en °C</text>
  </g>

  <!-- formule -->
  <rect x="80" y="284" width="540" height="60" rx="10" fill="#eaf2fb" stroke="#1b3a63" stroke-width="2"/>
  <text class="f" x="350" y="312" text-anchor="middle">température du tube (°C) − température de saturation (°C)</text>
  <text class="f" x="350" y="334" text-anchor="middle">= surchauffe, en kelvins (K)</text>
  <text class="s" x="350" y="376" text-anchor="middle">Le résultat est un écart entre deux températures : il s'exprime en kelvins (K).</text>
</svg>
