<title>Compresseur semi-hermétique avec ses deux vannes de service rotalock</title>
<!-- pieds et sol -->
<line x1="22" y1="68" x2="18" y2="75" stroke="#1b3a63" stroke-width="2"/>
<line x1="96" y1="68" x2="100" y2="75" stroke="#1b3a63" stroke-width="2"/>
<line x1="12" y1="75" x2="106" y2="75" stroke="#1b3a63" stroke-width="2"/>
<!-- corps -->
<rect x="10" y="30" width="100" height="38" rx="8" fill="#fffdf8" stroke="#1b3a63" stroke-width="2.4"/>
<!-- calotte moteur (droite) : ailettes -->
<line x1="76" y1="30" x2="76" y2="68" stroke="#1b3a63" stroke-width="1.4"/>
<line x1="84" y1="30" x2="84" y2="68" stroke="#79848d" stroke-width="1.2"/>
<line x1="92" y1="30" x2="92" y2="68" stroke="#79848d" stroke-width="1.2"/>
<line x1="100" y1="30" x2="100" y2="68" stroke="#79848d" stroke-width="1.2"/>
<!-- boîte à bornes -->
<rect x="88" y="20" width="14" height="10" rx="2" fill="#56616a" stroke="#1b3a63" stroke-width="1.6"/>
<!-- culasse (gauche) -->
<rect x="12" y="24" width="34" height="10" rx="3" fill="#efbd98" stroke="#1b3a63" stroke-width="2"/>
<line x1="20" y1="24" x2="20" y2="34" stroke="#1b3a63" stroke-width="1.2"/>
<line x1="29" y1="24" x2="29" y2="34" stroke="#1b3a63" stroke-width="1.2"/>
<line x1="38" y1="24" x2="38" y2="34" stroke="#1b3a63" stroke-width="1.2"/>
<!-- ============ vanne de service REFOULEMENT (sur la culasse) ======== -->
<path d="M22 24V14H34V24" fill="#f1b06f" stroke="#1b3a63" stroke-width="2" stroke-linejoin="round"/>
<!-- capuchon de tige -->
<rect x="20" y="4" width="16" height="7" rx="3" fill="#29343e" stroke="#1b3a63" stroke-width="1.6"/>
<line x1="28" y1="11" x2="28" y2="14" stroke="#1b3a63" stroke-width="2"/>
<!-- prise de service (vers la gauche), protégée -->
<line x1="22" y1="19" x2="12" y2="19" stroke="#1b3a63" stroke-width="2.6"/>
<rect x="6" y="15" width="7" height="8" rx="2" fill="#29343e" stroke="#1b3a63" stroke-width="1.4"/>
<circle cx="4" cy="19" r="1.6" fill="#1b3a63"/>
<!-- ============ vanne de service ASPIRATION (côté moteur) =========== -->
<path d="M79 30V16H93V30" fill="#f1b06f" stroke="#1b3a63" stroke-width="2.2" stroke-linejoin="round"/>
<!-- capuchon de tige -->
<rect x="77" y="5" width="18" height="8" rx="3" fill="#29343e" stroke="#1b3a63" stroke-width="1.6"/>
<line x1="86" y1="13" x2="86" y2="16" stroke="#1b3a63" stroke-width="2"/>
<!-- prise de service (vers la droite), protégée -->
<line x1="93" y1="22" x2="104" y2="22" stroke="#1b3a63" stroke-width="2.6"/>
<rect x="103" y="18" width="7" height="8" rx="2" fill="#29343e" stroke="#1b3a63" stroke-width="1.4"/>
<circle cx="112" cy="22" r="1.6" fill="#1b3a63"/>
</svg>
