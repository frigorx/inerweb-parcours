<!-- caisse de la station -->
<rect x="-24" y="-12" width="48" height="30" rx="4" fill="white" stroke="#1b3a63" stroke-width="1"/>
<!-- poignée -->
<path d="M -10 -12 L -10 -20 L 10 -20 L 10 -12" fill="none" stroke="#1b3a63" stroke-width="1"/>
<!-- ouïes de ventilation -->
<line x1="-18" y1="8" x2="-6" y2="8" stroke="#1b3a63" stroke-width="0.8"/>
<line x1="-18" y1="11" x2="-6" y2="11" stroke="#1b3a63" stroke-width="0.8"/>
<line x1="-18" y1="14" x2="-6" y2="14" stroke="#1b3a63" stroke-width="0.8"/>
<!-- vanne centrale -->
<circle cx="0" cy="0" r="4" fill="white" stroke="#1b3a63" stroke-width="1"/>
<line x1="0" y1="0" x2="2.8" y2="-2.8" stroke="#1b3a63" stroke-width="1.2"/>
<!-- vanne IN (gauche) et son raccord -->
<circle cx="-14" cy="-4" r="3.2" fill="white" stroke="#1b3a63" stroke-width="1"/>
<line x1="-14" y1="-4" x2="-14" y2="-7" stroke="#1b3a63" stroke-width="1.2"/>
<text x="-14" y="4" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="5" fill="#1b3a63">IN</text>
<line x1="-24" y1="-4" x2="-28" y2="-4" stroke="#1b3a63" stroke-width="1"/>
<circle cx="-28" cy="-4" r="1.5" fill="#1b3a63"/>
<!-- vanne OUT (droite) et son raccord -->
<circle cx="14" cy="-4" r="3.2" fill="white" stroke="#1b3a63" stroke-width="1"/>
<line x1="14" y1="-4" x2="14" y2="-7" stroke="#1b3a63" stroke-width="1.2"/>
<text x="14" y="4" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="5" fill="#1b3a63">OUT</text>
<line x1="24" y1="-4" x2="28" y2="-4" stroke="#1b3a63" stroke-width="1"/>
<circle cx="28" cy="-4" r="1.5" fill="#1b3a63"/>
</svg>
