<!-- corps de la bouteille -->
<rect x="-11" y="-14" width="22" height="38" rx="6" fill="white" stroke="#1b3a63" stroke-width="1"/>
<!-- épaule + col -->
<path d="M -6 -14 L -3 -20 L 3 -20 L 6 -14" fill="white" stroke="#1b3a63" stroke-width="1"/>
<!-- robinet -->
<line x1="0" y1="-20" x2="0" y2="-24" stroke="#1b3a63" stroke-width="1"/>
<line x1="-4" y1="-24" x2="4" y2="-24" stroke="#1b3a63" stroke-width="1.4"/>
<!-- sortie latérale, raccord -->
<line x1="0" y1="-22" x2="8" y2="-22" stroke="#1b3a63" stroke-width="1"/>
<circle cx="8" cy="-22" r="1.5" fill="#1b3a63"/>
<!-- niveau de liquide (trait + hachures légères, jamais la couleur seule) -->
<line x1="-11" y1="6" x2="11" y2="6" stroke="#1b3a63" stroke-width="1" stroke-dasharray="3 2"/>
<line x1="-8" y1="11" x2="-2" y2="17" stroke="#1b3a63" stroke-width="0.6"/>
<line x1="-2" y1="11" x2="4" y2="17" stroke="#1b3a63" stroke-width="0.6"/>
<line x1="4" y1="11" x2="10" y2="17" stroke="#1b3a63" stroke-width="0.6"/>
