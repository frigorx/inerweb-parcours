<!-- corps haut et fin : bouteille de gaz comprimé -->
<rect x="-9" y="-16" width="18" height="42" rx="5" fill="white" stroke="#1b3a63" stroke-width="1"/>
<path d="M -5 -16 L -2.5 -22 L 2.5 -22 L 5 -16" fill="white" stroke="#1b3a63" stroke-width="1"/>
<!-- robinet -->
<line x1="0" y1="-22" x2="0" y2="-26" stroke="#1b3a63" stroke-width="1"/>
<line x1="-4" y1="-26" x2="4" y2="-26" stroke="#1b3a63" stroke-width="1.4"/>
<!-- détendeur : deux petits cadrans sur la sortie -->
<line x1="0" y1="-24" x2="10" y2="-24" stroke="#1b3a63" stroke-width="1"/>
<circle cx="10" cy="-28" r="3" fill="white" stroke="#1b3a63" stroke-width="1"/>
<circle cx="16" cy="-28" r="3" fill="white" stroke="#1b3a63" stroke-width="1"/>
<!-- vis de réglage -->
<line x1="13" y1="-24" x2="13" y2="-19" stroke="#1b3a63" stroke-width="1"/>
<line x1="11" y1="-19" x2="15" y2="-19" stroke="#1b3a63" stroke-width="1.4"/>
<!-- sortie détendue, raccord -->
<line x1="16" y1="-24" x2="20" y2="-24" stroke="#1b3a63" stroke-width="1"/>
<circle cx="20" cy="-24" r="1.5" fill="#1b3a63"/>
<!-- marquage N2 stylisé : bande d'épaule -->
<line x1="-9" y1="-11" x2="9" y2="-11" stroke="#1b3a63" stroke-width="1" stroke-dasharray="2 2"/>
</svg>
