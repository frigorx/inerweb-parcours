<style>
html, body { margin: 0; padding: 0; background: #f7f1e7; }
.pl { position: absolute; inset: 0; display: flex; flex-direction: column; background: #f7f1e7;
      font-family: "Trebuchet MS", Calibri, sans-serif; color: #1b3a63; }
.pl-texte { padding: 12px 20px 10px; background: #fffdf8; border-bottom: 2px solid #e3d9c8; }
.pl-num { font-size: 14px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #c9451a; }
.pl-texte h3 { margin: 4px 0; font-size: 25px; line-height: 1.15; }
.pl-texte p { margin: 0; font-size: 19px; line-height: 1.35; color: #24324a; }
.pl-vue { position: relative; flex: 1; min-height: 0; }
.pl-vue svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.pl-nav { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 10px;
          padding: 8px; background: #fffdf8; border-top: 2px solid #e3d9c8; }
.pl-nav button { font: 800 17px "Trebuchet MS", Calibri, sans-serif; color: #1b3a63; background: #fffdf8;
                 border: 2px solid #1b3a63; border-radius: 10px; padding: 8px 14px; cursor: pointer; }
.pl-nav button.principal { background: #1b3a63; color: #fffdf8; }
.pl-nav button:disabled { opacity: 0.35; cursor: default; }
.pl-nav button:focus-visible { outline: 3px solid #e6a817; outline-offset: 2px; }
.pl-points { display: flex; gap: 6px; }
.pl-points button { width: 38px; height: 38px; padding: 0; border-radius: 50%; }
.pl-points button.actif { background: #ff6b35; border-color: #c9451a; color: #fffdf8; }
@media (max-width: 760px) {
  .pl-texte h3 { font-size: 21px; }
  .pl-texte p { font-size: 17px; }
  .pl-nav { gap: 6px; }
  .pl-nav button { font-size: 15px; padding: 6px 9px; }
  .pl-points button { width: 32px; height: 32px; }
}
</style>
