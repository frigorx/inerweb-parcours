  <title id="title">Coupe pédagogique d’un filtre-déshydrateur</title>
  <desc id="desc">Le fluide entre à gauche, traverse le noyau dessiccant, le média filtrant et la plaque perforée, puis sort à droite. Un ressort maintient l’ensemble.</desc>
