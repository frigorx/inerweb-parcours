  <title id="title">Le danger de la prise P1</title>
  <desc id="desc">Le carré ne peut jamais isoler P1 du compresseur. Installation chargée : ne jamais défaire le bouchon P1.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1b3a63" flood-opacity=".14"/></filter>
    <pattern id="isolated-hatch" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="22" height="22" fill="#edf1f3"/><line x1="0" y1="0" x2="0" y2="22" stroke="#9aaab4" stroke-width="8"/></pattern>
    <marker id="arrow-ink" viewBox="0 0 50 50" refX="44" refY="25" markerWidth="50" markerHeight="50" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M3 4L47 25L3 46Z" fill="#10233c"/></marker>
    <marker id="arrow-blue" viewBox="0 0 50 50" refX="44" refY="25" markerWidth="50" markerHeight="50" markerUnits="userSpaceOnUse" orient="auto"><path d="M3 4L47 25L3 46Z" fill="#3d7fca"/></marker>
    <marker id="arrow-red" viewBox="0 0 50 50" refX="44" refY="25" markerWidth="50" markerHeight="50" markerUnits="userSpaceOnUse" orient="auto"><path d="M3 4L47 25L3 46Z" fill="#c0392b"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#f7f1e7"/>
  <rect x="70" y="48" width="174" height="58" rx="29" fill="#1b3a63"/>
  <text x="157" y="88" font-size="30" font-weight="800" fill="#fffdf8" text-anchor="middle" font-family="Trebuchet MS, Calibri, Arial, sans-serif">ÉTAPE 7</text>
  <text x="276" y="94" font-size="58" font-weight="850" fill="#1b3a63" font-family="Trebuchet MS, Calibri, Arial, sans-serif">Le danger de la prise P1</text>
  <text x="76" y="154" font-size="32" font-weight="600" fill="#637285">Le carré ne peut jamais isoler P1 du compresseur.</text>
  
      <rect x="105" y="218" width="1710" height="700" rx="42" fill="#fffdf8" stroke="#aab9c5" stroke-width="4" filter="url(#shadow)"/>
      <rect x="270" y="355" width="1020" height="390" rx="90" fill="#dfe7ea" stroke="#10233c" stroke-width="9"/>
      <circle cx="800" cy="550" r="150" fill="#fffdf8" stroke="#aab9c5" stroke-width="6"/>
      <path d="M800 700V855" stroke="#c0392b" stroke-width="78"/>
      <path d="M800 550H1180V795" fill="none" stroke="#c0392b" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="729" y="816" width="142" height="76" rx="20" fill="#10233c"/><text x="800" y="868" text-anchor="middle" font-size="40" font-weight="900" fill="#fffdf8">C</text>
      <rect x="1110" y="746" width="142" height="76" rx="20" fill="#c0392b"/><text x="1181" y="798" text-anchor="middle" font-size="40" font-weight="900" fill="#fffdf8">P1</text>
      <rect x="1328" y="300" width="390" height="510" rx="34" fill="#fff0ee" stroke="#c0392b" stroke-width="6"/>
      <circle cx="1523" cy="420" r="72" fill="#c0392b"/>
      <text x="1523" y="444" text-anchor="middle" font-size="68" font-weight="900" fill="#fffdf8">!</text>
      <text x="1523" y="548" font-size="38" font-weight="700" fill="#c0392b" text-anchor="middle"><tspan x="1523" dy="0">P1 reste reliée</tspan><tspan x="1523" dy="50">au compresseur</tspan><tspan x="1523" dy="50">dans toutes les</tspan><tspan x="1523" dy="50">positions.</tspan></text>
      <path d="M1180 680H1405" fill="none" stroke="#c0392b" stroke-width="7" marker-end="url(#arrow-red)"/>
      <text x="765" y="305" text-anchor="middle" font-size="38" font-weight="850" fill="#10233c">Le pointeau ne coupe jamais ce passage.</text>
  <rect x="70" y="963" width="1780" height="76" rx="22" fill="#fffdf8" stroke="#aab9c5" stroke-width="3"/><circle cx="112" cy="1001" r="16" fill="#ff6b35"/><text x="148" y="1012" font-size="34" font-weight="800" fill="#10233c">Installation chargée : ne jamais défaire le bouchon P1.</text>
