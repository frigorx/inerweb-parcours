<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" font-family="Calibri, Segoe UI, Arial, sans-serif">
  <title id="title">Une seule tige mobile</title>
  <desc id="desc">Le presse-étoupe reste fixe ; l’ensemble orange se déplace. Quand on tourne le carré, sa position longitudinale change avec celle du pointeau.</desc>
