        <path class="vr-seat vr-seat-back" d="M875 286 H918 L944 320 V400 L918 434 H875 V394 H899 L918 374 V346 L899 326 H875 Z" />
      </g>

      <g class="vr-seals" aria-label="Joints et bagues">
        <rect class="vr-seal" x="1042" y="286" width="18" height="148" rx="7" />
        <rect class="vr-ring" x="1071" y="286" width="22" height="148" rx="7" />
      </g>

      <g class="vr-stem-clip">
        
      <g class="vr-stem vr-stem-static">
        <path class="vr-clapet" d="M340 360 L395 316 H438 V404 H395 Z" />
        <rect class="vr-stem-rod" x="420" y="340" width="770" height="40" rx="13" />
        <path class="vr-back-cone" d="M620 323 L655 340 H694 L718 360 L694 380 H655 L620 397 Z" />
        <g class="vr-thread-lines">
          <path d="M1000 340 l22 40 M1020 340 l22 40 M1040 340 l22 40 M1060 340 l22 40 M1080 340 l22 40" />
        </g>
      </g>
        
      <g class="vr-stem mobile vr-stem-mobile">
        <path class="vr-clapet" d="M340 360 L395 316 H438 V404 H395 Z" />
        <rect class="vr-stem-rod" x="420" y="340" width="770" height="40" rx="13" />
        <path class="vr-back-cone" d="M620 323 L655 340 H694 L718 360 L694 380 H655 L620 397 Z" />
        <g class="vr-thread-lines">
          <path d="M1000 340 l22 40 M1020 340 l22 40 M1040 340 l22 40 M1060 340 l22 40 M1080 340 l22 40" />
        </g>
      </g>
      </g>

      <g class="mobile vr-square-mobile" aria-label="Carré de manœuvre">
        <rect class="vr-square" x="1140" y="324" width="72" height="72" rx="8" />
        <path class="vr-square-cross" d="M1154 338 L1198 382 M1198 338 L1154 382" />
      </g>
      <g class="vr-square-static" aria-hidden="true">
        <rect class="vr-square" x="1140" y="324" width="72" height="72" rx="8" />
        <path class="vr-square-cross" d="M1154 338 L1198 382 M1198 338 L1154 382" />
      </g>
    
      <g class="vr-fluid-layer" aria-label="Chemins du fluide et de la pression">
        <g class="vr-flow vr-flow-main vr-main-bp">
          <path class="vr-flow-line vr-main-line" d="M42 360 H454 Q560 360 560 470 V606" marker-end="url(#still-mid-bp-arrow)" />
          
      <circle class="mobile vr-flow-pulse" r="8" visibility="hidden" aria-hidden="true">
        <set attributeName="visibility" to="visible" begin="0s" />
        <animateMotion dur="2.6s" repeatCount="indefinite" path="M42 360 H454 Q560 360 560 470 V606" />
      </circle>
      <circle class="mobile vr-flow-pulse vr-flow-pulse-late" r="8" visibility="hidden" aria-hidden="true">
        <set attributeName="visibility" to="visible" begin="0s" />
        <animateMotion begin="-1.3s" dur="2.6s" repeatCount="indefinite" path="M42 360 H454 Q560 360 560 470 V606" />
      </circle>
        </g>
        <g class="vr-flow vr-flow-main vr-main-hp">
          <path class="vr-flow-line vr-main-line vr-hp-line" d="M560 606 V470 Q560 360 454 360 H42" marker-end="url(#still-mid-bp-arrow)" />
          
      <circle class="mobile vr-flow-pulse" r="8" visibility="hidden" aria-hidden="true">
        <set attributeName="visibility" to="visible" begin="0s" />
        <animateMotion dur="2.6s" repeatCount="indefinite" path="M560 606 V470 Q560 360 454 360 H42" />
      </circle>
      <circle class="mobile vr-flow-pulse vr-flow-pulse-late" r="8" visibility="hidden" aria-hidden="true">
        <set attributeName="visibility" to="visible" begin="0s" />
        <animateMotion begin="-1.3s" dur="2.6s" repeatCount="indefinite" path="M560 606 V470 Q560 360 454 360 H42" />
      </circle>
        </g>

        <g class="vr-flow vr-flow-p1">
          <path class="vr-pressure-line" d="M560 606 V360 H590 V108" marker-end="url(#still-mid-bp-pressure-arrow)" />
          
      <circle class="mobile vr-flow-pulse" r="8" visibility="hidden" aria-hidden="true">
        <set attributeName="visibility" to="visible" begin="0s" />
        <animateMotion dur="3.1s" repeatCount="indefinite" path="M560 606 V360 H590 V108" />
      </circle>
      <circle class="mobile vr-flow-pulse vr-flow-pulse-late" r="8" visibility="hidden" aria-hidden="true">
        <set attributeName="visibility" to="visible" begin="0s" />
        <animateMotion begin="-1.3s" dur="3.1s" repeatCount="indefinite" path="M560 606 V360 H590 V108" />
      </circle>
        </g>

        <g class="vr-flow vr-flow-p">
          <path class="vr-pressure-line" d="M560 606 V360 H992 V108" marker-end="url(#still-mid-bp-pressure-arrow)" />
          
      <circle class="mobile vr-flow-pulse" r="8" visibility="hidden" aria-hidden="true">
        <set attributeName="visibility" to="visible" begin="0s" />
        <animateMotion dur="3.3s" repeatCount="indefinite" path="M560 606 V360 H992 V108" />
      </circle>
      <circle class="mobile vr-flow-pulse vr-flow-pulse-late" r="8" visibility="hidden" aria-hidden="true">
        <set attributeName="visibility" to="visible" begin="0s" />
        <animateMotion begin="-1.3s" dur="3.3s" repeatCount="indefinite" path="M560 606 V360 H992 V108" />
      </circle>
        </g>

        <g class="vr-flow vr-flow-t-isolated">
          <path class="vr-isolated-line" d="M42 360 H316" marker-end="url(#still-mid-bp-stop)" />
          <text class="vr-isolated-word" x="124" y="346">T ISOLÉE</text>
        </g>

        <g class="vr-flow vr-flow-p-off">
          <path class="vr-isolated-line" d="M992 108 V270" marker-end="url(#still-mid-bp-stop)" />
          <text class="vr-isolated-word" x="1010" y="184">P ISOLÉE</text>
        </g>
      </g>
    
      <g class="vr-port-labels" aria-label="Repères des raccords">
        <g transform="translate(18 258)">
          <rect class="vr-label-box" width="176" height="56" rx="13" />
          <text class="vr-label-code" x="16" y="24">T</text>
          <text class="vr-label-text" x="48" y="23">TUYAUTERIE</text>
          <text class="vr-label-sub" x="48" y="42">ligne frigorifique</text>
        </g>
        <g transform="translate(466 630)">
          <rect class="vr-label-box" width="210" height="58" rx="13" />
          <text class="vr-label-code" x="15" y="25">C</text>
          <text class="vr-label-text" x="49" y="24">COMPRESSEUR</text>
          <text class="vr-label-sub" x="49" y="44">raccord Rotalock</text>
        </g>
        <g transform="translate(484 12)">
          <rect class="vr-label-box vr-label-p1" width="218" height="64" rx="13" />
          <text class="vr-label-code" x="14" y="26">P1</text>
          <text class="vr-label-text" x="57" y="24">PRESSOSTAT</text>
          <text class="vr-label-sub" x="57" y="45">permanent · sous pression</text>
        </g>
        <g transform="translate(900 12)">
          <rect class="vr-label-box vr-label-p" width="192" height="64" rx="13" />
          <text class="vr-label-code" x="14" y="26">P</text>
          <text class="vr-label-text" x="48" y="24">SERVICE</text>
          <text class="vr-label-sub" x="48" y="45">flexible du manifold</text>
        </g>
        <g transform="translate(1084 245)">
          <rect class="vr-label-box" width="174" height="60" rx="13" />
          <text class="vr-label-text" x="14" y="24">CARRÉ</text>
          <text class="vr-label-sub" x="14" y="44">de manœuvre</text>
        </g>
      </g>
    
    
    
      <g class="vr-state-note vr-note-back" transform="translate(252 646)">
        <rect width="760" height="58" rx="16" />
        <text x="20" y="24"><tspan class="vr-note-strong">T ↔ C : passage ouvert.</tspan> P : isolée par le siège arrière.</text>
        <text x="20" y="45">P1 ↔ C : pression permanente vers le pressostat.</text>
      </g>
      <g class="vr-state-note vr-note-mid" transform="translate(252 646)">
        <rect width="760" height="58" rx="16" />
        <text x="20" y="24"><tspan class="vr-note-strong">T ↔ C : passage ouvert.</tspan> P ↔ C : lecture ou intervention.</text>
        <text x="20" y="45">P1 ↔ C : pression permanente vers le pressostat.</text>
      </g>
      <g class="vr-state-note vr-note-front" transform="translate(252 646)">
        <rect width="760" height="58" rx="16" />
        <text x="20" y="24"><tspan class="vr-note-strong">T : isolée du compresseur.</tspan> P ↔ C : communication ouverte.</text>
        <text x="20" y="45">P1 ↔ C : pression permanente vers le pressostat.</text>
      </g>
  </g>
</svg>
