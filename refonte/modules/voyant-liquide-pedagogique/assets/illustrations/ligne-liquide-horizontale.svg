  <title id="title">Montage horizontal de référence sur la ligne liquide</title>
  <desc id="desc">Le fluide circule de gauche à droite dans un filtre-déshydrateur puis dans un voyant liquide. Le voyant est directement placé après le filtre.</desc>
  <defs>
    <linearGradient id="copper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9c4828"/><stop offset=".25" stop-color="#f2bf81"/><stop offset=".58" stop-color="#bf6538"/><stop offset="1" stop-color="#7f3922"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#667582"/><stop offset=".18" stop-color="#eef2f4"/><stop offset=".42" stop-color="#4b5965"/><stop offset="1" stop-color="#172431"/></linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#93651d"/><stop offset=".28" stop-color="#f0d27c"/><stop offset=".58" stop-color="#c8962f"/><stop offset=".82" stop-color="#ffe8a5"/><stop offset="1" stop-color="#805515"/></linearGradient>
    <radialGradient id="glass" cx="38%" cy="30%" r="72%"><stop stop-color="#fff"/><stop offset=".48" stop-color="#d7ecf4"/><stop offset="1" stop-color="#78a9bd"/></radialGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#10233c" flood-opacity=".2"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3d7fca"/></marker>
  </defs>
  <rect x="22" y="20" width="1156" height="478" rx="30" fill="#fffdf8" stroke="#1b3a63" stroke-width="4"/>
  <text x="600" y="65" fill="#1b3a63" font-family="Trebuchet MS,Calibri,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle">MONTAGE DE RÉFÉRENCE · LIGNE LIQUIDE HORIZONTALE</text>
  <path d="M82 292H1118" stroke="url(#copper)" stroke-width="42" stroke-linecap="round"/>
  <path d="M90 280H1110" stroke="#fff1da" stroke-width="7" stroke-linecap="round" opacity=".56"/>
  <g filter="url(#shadow)">
    <path d="M225 234H286L318 205H535L567 234H628V350H567L535 379H318L286 350H225Z" fill="url(#steel)" stroke="#1b3a63" stroke-width="6"/>
    <path d="M300 228V356M544 228V356" stroke="#d9e0e4" stroke-width="7" opacity=".75"/>
    <path d="M364 292H492" stroke="#fff" stroke-width="7" opacity=".38"/>
    <path d="M388 292H482" stroke="#3d7fca" stroke-width="8" marker-end="url(#arrow)"/>
  </g>
  <g filter="url(#shadow)">
    <path d="M706 238H751L777 210H901L927 238H972V346H927L901 374H777L751 346H706Z" fill="url(#brass)" stroke="#1b3a63" stroke-width="6"/>
    <circle cx="839" cy="292" r="73" fill="#8b611c" stroke="#1b3a63" stroke-width="6"/>
    <circle cx="839" cy="292" r="58" fill="url(#glass)" stroke="#fffdf8" stroke-width="6"/>
    <circle cx="839" cy="292" r="31" fill="#fffdf8" stroke="#637285" stroke-width="4"/>
    <circle cx="839" cy="292" r="18" fill="#1e7e54" stroke="#0f5a39" stroke-width="5"/>
    <path d="M802 262A50 50 0 0 1 842 244" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".72"/>
  </g>
  <path d="M130 159H1055" fill="none" stroke="#3d7fca" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="592" y="142" fill="#3d7fca" font-family="Calibri,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">SENS DU FLUIDE</text>
  <path d="M426 393V432H839V393" fill="none" stroke="#c9451a" stroke-width="5" stroke-dasharray="12 8"/>
  <text x="426" y="462" fill="#10233c" font-family="Calibri,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">1 · FILTRE-DÉSHYDRATEUR</text>
  <text x="839" y="462" fill="#10233c" font-family="Calibri,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">2 · VOYANT JUSTE APRÈS</text>
</svg>
