    <path d="M 2 1 L 0 3 L -2 1 L -10 5 L -10 -5 L 10 5 L 10 -5 L -2 1 L 0 0 Z" fill="#ffffff" stroke="#111827" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
