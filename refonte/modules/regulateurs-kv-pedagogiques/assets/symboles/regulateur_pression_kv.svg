  <title id="title">Régulateur de pression KV</title>
  <desc id="desc">Symbole normalisé fourni pour les régulateurs KVP, KVL et KVR. Le raccord d’entrée est en bas, le fluide remonte dans le corps puis ressort à droite après un passage à 90 degrés. La vis de réglage est placée au-dessus.</desc>
